# VPS TLS overlay: adds Caddy in front of the gateway.
#
# Caddy terminates TLS with an automatic Let's Encrypt certificate for
# MOA_DOMAIN and proxies HTTP plus the voice WebSocket to the gateway over the
# compose network. The gateway's own published port stays loopback-only (see
# GATEWAY_BIND in docker-compose.yml).
#
# Requires in the compose env file:
#   MOA_DOMAIN=api.example.com
#   ACME_EMAIL=you@example.com

services:
  gateway:
    volumes:
      # Optional provider credential bind mount. When unset, this mounts
      # /dev/null to an unused path so the stack still boots with loopback
      # providers and no host credential file.
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/tmp/no-google-credentials.json}:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MOA_DOMAIN: ${MOA_DOMAIN:?set MOA_DOMAIN in the compose env file}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the compose env file}
    volumes:
      - ./gateway/deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - moa-caddy-data:/data
      - moa-caddy-config:/config

volumes:
  moa-caddy-data:
  moa-caddy-config:
