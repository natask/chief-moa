plugins {
    id 'com.android.application'
    id 'jacoco'
}

def envOrDefault(String name, String fallback) {
    def value = System.getenv(name)
    return value == null || value.trim().isEmpty() ? fallback : value.trim()
}

def gitSha() {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
        }
        return out.toString().trim()
    } catch (ignored) {
        return 'unknown'
    }
}

def releaseKeystorePath = envOrDefault('MOA_ANDROID_KEYSTORE_PATH', '')
def hasReleaseSigning = !releaseKeystorePath.isEmpty()

android {
    namespace 'ai.moa.assistant'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'ai.moa.assistant'
        minSdk 26
        targetSdk 35
        versionCode envOrDefault('MOA_ANDROID_VERSION_CODE', '1').toInteger()
        versionName envOrDefault('MOA_ANDROID_VERSION_NAME', '0.1.0')
        buildConfigField 'String', 'GIT_SHA', "\"${envOrDefault('MOA_ANDROID_GIT_SHA', gitSha())}\""
        buildConfigField 'String', 'DEFAULT_GATEWAY_URL', "\"${envOrDefault('MOA_DEFAULT_GATEWAY_URL', 'https://api.agee.app')}\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword envOrDefault('MOA_ANDROID_KEYSTORE_PASSWORD', '')
                keyAlias envOrDefault('MOA_ANDROID_KEY_ALIAS', '')
                keyPassword envOrDefault('MOA_ANDROID_KEY_PASSWORD', envOrDefault('MOA_ANDROID_KEYSTORE_PASSWORD', ''))
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

jacoco {
    toolVersion = '0.8.12'
}

def generatedAndroidClassExcludes = [
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/R$*.*',
        '**/R.*'
]

def debugProductionClasses = files(
        fileTree(
                dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
                excludes: generatedAndroidClassExcludes
        ),
        fileTree(
                dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug'),
                excludes: generatedAndroidClassExcludes
        )
)

def debugProductionSources = files('src/main/java', 'src/main/kotlin')

def debugUnitTestCoverageData = layout.buildDirectory.file(
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
)

// Production-only baseline after the focused JVM tests landed on 2026-07-15.
// This is a non-regression ratchet, not the final 90% coverage requirement.
// Raise these floors as Android lifecycle logic is extracted and tested; never
// lower them to make verification pass.
def debugUnitTestCoverageRatchet = [
        // 1,448 / 8,070 executable production lines.
        line  : new BigDecimal('0.1794299876084262'),
        // 976 / 4,477 production branches.
        branch: new BigDecimal('0.2180031270940361'),
        // 261 / 1,110 production methods (the JaCoCo function analogue).
        method: new BigDecimal('0.2351351351351351')
]

tasks.register('reportDebugUnitTestCoverage', JacocoReport) {
    group = 'verification'
    description = 'Reports debug JVM coverage over production Java/Kotlin classes only.'
    dependsOn tasks.named('testDebugUnitTest')

    executionData.from(debugUnitTestCoverageData)
    classDirectories.from(debugProductionClasses)
    sourceDirectories.from(debugProductionSources)

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('verifyDebugUnitTestCoverage', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Verifies the production-only debug JVM coverage ratchet.'
    dependsOn tasks.named('testDebugUnitTest')

    executionData.from(debugUnitTestCoverageData)
    classDirectories.from(debugProductionClasses)
    sourceDirectories.from(debugProductionSources)

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = debugUnitTestCoverageRatchet.line
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = debugUnitTestCoverageRatchet.branch
            }
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = debugUnitTestCoverageRatchet.method
            }
        }
    }
}

def imePolicyClasses = files(
        fileTree(
                dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
                includes: [
                        '**/MoaEditorSensitivityPolicy*.class',
                        '**/MoaEditorSessionBinding*.class',
                        '**/MoaLiteralTranscriptPolicy*.class'
                ]
        )
)

def screenEvidenceEnvelopeClasses = files(
        fileTree(
                dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
                includes: [
                        '**/MoaScreenEvidenceEnvelope*.class',
                        '**/MoaScreenContextCache*.class',
                        '**/MoaScreenContextReleasePolicy*.class'
                ]
        )
)

tasks.register('reportImePolicyCoverage', JacocoReport) {
    group = 'verification'
    description = 'Reports focused coverage for the pure IME safety and session policy.'
    dependsOn tasks.named('testDebugUnitTest')

    executionData.from(debugUnitTestCoverageData)
    classDirectories.from(imePolicyClasses)
    sourceDirectories.from(debugProductionSources)

    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/imePolicy/xml/report.xml')
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/imePolicy/html')
    }
}

tasks.register('verifyImePolicyCoverage', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Requires >=90% line, branch, and method coverage for pure IME policy.'
    dependsOn tasks.named('testDebugUnitTest')

    executionData.from(debugUnitTestCoverageData)
    classDirectories.from(imePolicyClasses)
    sourceDirectories.from(debugProductionSources)

    violationRules {
        rule {
            element = 'BUNDLE'
            ['LINE', 'BRANCH', 'METHOD'].each { counterName ->
                limit {
                    counter = counterName
                    value = 'COVEREDRATIO'
                    minimum = new BigDecimal('0.90')
                }
            }
        }
    }
}

tasks.register('reportScreenEvidenceEnvelopeCoverage', JacocoReport) {
    group = 'verification'
    description = 'Reports focused coverage for Android screen-evidence serialization.'
    dependsOn tasks.named('testDebugUnitTest')

    executionData.from(debugUnitTestCoverageData)
    classDirectories.from(screenEvidenceEnvelopeClasses)
    sourceDirectories.from(debugProductionSources)

    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/screenEvidenceEnvelope/xml/report.xml')
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/screenEvidenceEnvelope/html')
    }
}

tasks.register('verifyScreenEvidenceEnvelopeCoverage', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Requires >=90% line, branch, and method coverage for screen-evidence serialization.'
    dependsOn tasks.named('testDebugUnitTest')

    executionData.from(debugUnitTestCoverageData)
    classDirectories.from(screenEvidenceEnvelopeClasses)
    sourceDirectories.from(debugProductionSources)

    violationRules {
        rule {
            element = 'BUNDLE'
            ['LINE', 'BRANCH', 'METHOD'].each { counterName ->
                limit {
                    counter = counterName
                    value = 'COVEREDRATIO'
                    minimum = new BigDecimal('0.90')
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDebugUnitTestCoverage')
    dependsOn tasks.named('verifyImePolicyCoverage')
    dependsOn tasks.named('verifyScreenEvidenceEnvelopeCoverage')
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
