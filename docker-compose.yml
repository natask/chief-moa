# Chief Moa gateway stack: one gateway image plus Postgres.
#
# Named volumes are the shared event store. They survive image rebuilds and
# service restarts (versioned-state rule). A preview stack gets its own volumes
# by running with a different project name (-p); that is a preview, not a
# rollback path.
#
# Launch (repo root):
#   docker compose --env-file /opt/chief-moa/gateway.env up -d --build
# VPS with TLS (adds Caddy):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml \
#     --env-file /opt/chief-moa/gateway.env up -d --build

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        MOA_BUILD_SHA: ${MOA_BUILD_SHA:-unknown}
        MOA_BUILD_REF: ${MOA_BUILD_REF:-unknown}
        MOA_BUILD_TIME: ${MOA_BUILD_TIME:-unknown}
    image: chief-moa-gateway:${GATEWAY_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      release-control-db-init:
        condition: service_completed_successfully
    # Loopback publish by default: on a VPS only Caddy (same compose network)
    # should reach the gateway. Set GATEWAY_BIND=0.0.0.0 only for a trusted
    # private network without the TLS overlay.
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8787}:8787"
    environment:
      MOA_MODE: ${MOA_MODE:-self-host}
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      # The OTA store is moving onto its own volume so the host publisher
      # and the gateway stop sharing one directory tree. The gateway serves
      # from ANDROID_OTA_DIR once it holds a store and from the legacy path
      # until then, so the move and its rollback are both non-events for the
      # phone. See reference/architecture/deployment-plane.md.
      ANDROID_OTA_DIR: ${ANDROID_OTA_DIR:-/srv/android-ota}
      ANDROID_OTA_LEGACY_DIR: /data/android-ota
      DATABASE_URL: ${DATABASE_URL:-postgres://moa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the compose env file}@postgres:5432/moa_gateway}
      # First rollout remains disabled until the new database has one complete
      # backup/restore cycle. Enabling later exposes already-migrated routes.
      MOA_RELEASE_CONTROL_ENABLED: ${MOA_RELEASE_CONTROL_ENABLED:-0}
      MOA_RELEASE_CONTROL_MIGRATE_AT_BOOT: "0"
      MOA_RELEASE_CONTROL_TENANT_ID: ${MOA_RELEASE_CONTROL_TENANT_ID:-}
      MOA_RELEASE_CONTROL_OWNER_ID: ${MOA_RELEASE_CONTROL_OWNER_ID:-}
      RELEASE_CONTROL_DATABASE_URL: ${RELEASE_CONTROL_DATABASE_URL:-postgres://moa_release_app:${RELEASE_CONTROL_POSTGRES_PASSWORD:?set RELEASE_CONTROL_POSTGRES_PASSWORD in the compose env file}@postgres:5432/moa_release_control}
      RELEASE_CONTROL_POOL_MAX: ${RELEASE_CONTROL_POOL_MAX:-8}
      MOA_GATEWAY_TOKEN: ${MOA_GATEWAY_TOKEN:?set MOA_GATEWAY_TOKEN in the compose env file}
      MOA_DEPLOY_REVIEWER_TOKEN: ${MOA_DEPLOY_REVIEWER_TOKEN:-}
      MOA_PREVIEW_DEPLOYER_TOKEN: ${MOA_PREVIEW_DEPLOYER_TOKEN:-}
      MOA_PRODUCTION_PROMOTER_TOKEN: ${MOA_PRODUCTION_PROMOTER_TOKEN:-}
      MOA_DEPLOY_REVIEWER_ID: ${MOA_DEPLOY_REVIEWER_ID:-deployment-reviewer}
      MOA_PREVIEW_DEPLOYER_ID: ${MOA_PREVIEW_DEPLOYER_ID:-preview-deployer}
      MOA_PRODUCTION_PROMOTER_ID: ${MOA_PRODUCTION_PROMOTER_ID:-production-promoter}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-}
      ALLOW_AGENT_WITHOUT_TOKEN: "0"
      # The remote gateway queues agent runs; harnesses run on the user's
      # execution machine (worker pull). `echo` keeps the loop testable with no
      # model key and no harness credentials on the VPS.
      DEFAULT_AGENT_HARNESS: ${DEFAULT_AGENT_HARNESS:-echo}
      VOICE_MULTI_AGENT_HARNESSES: ${VOICE_MULTI_AGENT_HARNESSES:-echo}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_ID: ${MODEL_ID:-gpt-4o-mini}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-loopback}
      VOICE_STT_PROVIDER: ${VOICE_STT_PROVIDER:-loopback}
      VOICE_LLM_PROVIDER: ${VOICE_LLM_PROVIDER:-loopback}
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-loopback}
      # Streaming voice kill switch: "0" restores the pre-streaming blocking
      # reply path per turn. Unset/empty keeps streaming on. Mapped through so
      # the documented env switch is actually operable on compose deployments.
      VOICE_STREAMING: ${VOICE_STREAMING:-}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      VERTEX_EXPRESS_API_KEY: ${VERTEX_EXPRESS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_LOCATION: ${GCP_LOCATION:-us}
      CHIRP_MODEL: ${CHIRP_MODEL:-chirp_3}
      CHIRP_LANGUAGE_CODES: ${CHIRP_LANGUAGE_CODES:-en-US}
      # Blob storage for media bytes: local (default) keeps everything in the
      # data volume; gcs spools locally and write-behind-uploads to the bucket.
      BLOB_STORE: ${BLOB_STORE:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PREFIX: ${GCS_PREFIX:-}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      BLOB_SPOOL_MAX_AGE_MS: ${BLOB_SPOOL_MAX_AGE_MS:-}
      BLOB_JANITOR_INTERVAL_MS: ${BLOB_JANITOR_INTERVAL_MS:-}
    volumes:
      - moa-gateway-data:/data
      - moa-ota-data:/srv/android-ota
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const port = process.env.PORT || '8787'; fetch('http://127.0.0.1:' + port + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moa_gateway
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the compose env file}
    volumes:
      - moa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - default
      - release-publisher-db

  # Existing Postgres volumes predate release control, so docker-entrypoint
  # initialization is insufficient. This one-shot service creates the separate
  # database, applies every additive migration, and leaves the runtime with only
  # SELECT/INSERT authority.
  release-control-db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: moa
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the compose env file}
      RELEASE_CONTROL_APP_PASSWORD: ${RELEASE_CONTROL_POSTGRES_PASSWORD:?set RELEASE_CONTROL_POSTGRES_PASSWORD in the compose env file}
      RELEASE_CONTROL_PUBLISHER_PASSWORD: ${RELEASE_CONTROL_PUBLISHER_POSTGRES_PASSWORD:?set RELEASE_CONTROL_PUBLISHER_POSTGRES_PASSWORD in the compose env file}
    volumes:
      - ./gateway/deploy/vps/bootstrap-release-control.sql:/bootstrap/bootstrap.sql:ro
      - ./release_control_plane/migrations:/bootstrap/migrations:ro
    command:
      - /bin/sh
      - -eu
      - -c
      - >-
        psql -d postgres -v app_password="$$RELEASE_CONTROL_APP_PASSWORD"
        -v publisher_password="$$RELEASE_CONTROL_PUBLISHER_PASSWORD"
        -f /bootstrap/bootstrap.sql;
        for migration in /bootstrap/migrations/[0-9]*.sql; do
          psql -d moa_release_control -f "$$migration";
        done;
        psql -d moa_release_control -v ON_ERROR_STOP=1 -c
        "grant usage on schema public to moa_release_app;
        grant select on release_bundles, release_channel_head_events,
        release_assignment_events, release_install_receipts, release_feedback,
        release_device_credentials to moa_release_app;
        grant insert on release_assignment_events, release_install_receipts,
        release_feedback, release_device_credentials to moa_release_app;
        grant usage, select on sequence release_assignment_events_event_order_seq,
        release_install_receipts_event_order_seq, release_feedback_event_order_seq,
        release_device_credentials_event_order_seq to moa_release_app;
        grant execute on function release_authenticate_device_credential(text)
        to moa_release_app;
        grant usage on schema public to moa_release_publisher;
        grant select, insert on release_bundles, release_channel_head_events,
        release_publication_receipts to moa_release_publisher;
        grant usage, select on sequence release_bundles_event_order_seq,
        release_channel_head_events_event_order_seq,
        release_publication_receipts_event_order_seq to moa_release_publisher;"

  release-publisher:
    profiles: ["release-admin"]
    build:
      context: .
      dockerfile: release_control_plane/Dockerfile.publisher
    image: chief-moa-release-publisher:${GATEWAY_IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      release-control-db-init:
        condition: service_completed_successfully
    working_dir: /workspace
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      RELEASE_CONTROL_DATABASE_URL: postgres://moa_release_publisher:${RELEASE_CONTROL_PUBLISHER_POSTGRES_PASSWORD:?set RELEASE_CONTROL_PUBLISHER_POSTGRES_PASSWORD in the compose env file}@postgres:5432/moa_release_control
      RELEASE_PUBLICATION_MANIFEST: ${RELEASE_PUBLICATION_MANIFEST:-}
      MOA_REPOSITORY_RELEASE_AUTHORITY_ID: ${MOA_REPOSITORY_RELEASE_AUTHORITY_ID:-}
      MOA_REPOSITORY_RELEASE_GIT_SHA: ${MOA_REPOSITORY_RELEASE_GIT_SHA:-}
      MOA_REPOSITORY_RELEASE_SOURCE_REF: ${MOA_REPOSITORY_RELEASE_SOURCE_REF:-}
      MOA_REPOSITORY_RELEASE_CHANNELS: ${MOA_REPOSITORY_RELEASE_CHANNELS:-}
      MOA_REPOSITORY_RELEASE_PROMOTION_BUNDLE_ID: ${MOA_REPOSITORY_RELEASE_PROMOTION_BUNDLE_ID:-}
      MOA_REPOSITORY_RELEASE_PROMOTION_EVIDENCE_REF: ${MOA_REPOSITORY_RELEASE_PROMOTION_EVIDENCE_REF:-}
    volumes:
      - .:/workspace:ro
    networks:
      - release-publisher-db
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        exec node /app/release_control_plane/bin/release-publisher.mjs
        publish-manifest "$$RELEASE_PUBLICATION_MANIFEST"
        --confirm-publish-exact-release

volumes:
  moa-gateway-data:
  moa-ota-data:
  moa-postgres-data:

networks:
  release-publisher-db:
    internal: true
