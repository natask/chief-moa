<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in to Ag</title>
<style>
  :root{color-scheme:light dark;font:16px system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111318;color:#f4f5f7}.card{width:min(390px,calc(100% - 40px));padding:28px;border:1px solid #343842;border-radius:22px;background:#1b1e25}h1{margin:0 0 8px}p{color:#aeb4c0}label{display:grid;gap:6px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #444b58}button{cursor:pointer;background:#eef0ff;color:#171922;font-weight:650}.secondary{background:transparent;color:#eef0ff}#status{min-height:22px;color:#f3aaae}
</style>
<main class="card">
  <h1>Ag</h1><p>Sign in once. Ag will connect this device to your account.</p>
  <form id="form">
    <label>Name <input id="name" autocomplete="name" /></label>
    <label>Email <input id="email" type="email" autocomplete="email" required /></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" minlength="8" required /></label>
    <button type="submit">Sign in</button>
    <button class="secondary" id="signup" type="button">Create account</button>
  </form>
  <p id="status" role="status"></p>
</main>
<script>
  const status = document.querySelector('#status');
  const params = new URLSearchParams(location.search);
  const next = params.get('return') || '/';
  const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/';
  async function submit(path, includeName) {
    status.textContent = '';
    const body = { email: email.value, password: password.value };
    if (includeName) body.name = name.value || email.value.split('@')[0];
    const response = await fetch('/api/auth/' + path, { method:'POST', credentials:'include', headers:{'content-type':'application/json'}, body:JSON.stringify(body) });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) { status.textContent = result.message || result.error || 'Sign-in failed'; return; }
    location.assign(safeNext);
  }
  form.addEventListener('submit', event => { event.preventDefault(); submit('sign-in/email', false); });
  signup.addEventListener('click', () => submit('sign-up/email', true));
</script>
