<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A.G. Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f3;
      --ink: #171713;
      --muted: #6b6a62;
      --line: #d9d7cb;
      --panel: #ffffff;
      --panel-soft: #efeee6;
      --ok: #147a4d;
      --warn: #9b6700;
      --bad: #b3261e;
      --accent: #234fce;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid #191915;
      background: #191915;
      color: #fff;
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }
    button.secondary { background: var(--panel); color: var(--ink); border-color: var(--line); }
    button:disabled { opacity: .55; cursor: default; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 9px 10px;
      outline: none;
    }
    label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
    code { font-family: var(--mono); font-size: 12px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 26px; height: 26px; border-radius: 7px;
      background:
        linear-gradient(135deg, #171713 0 46%, transparent 46%),
        linear-gradient(135deg, transparent 54%, #234fce 54% 100%),
        #d7f0df;
      border: 1px solid #171713;
    }
    h1 { margin: 0; font-size: 17px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

    .shell { flex: 1; display: flex; min-height: 0; }
    .side {
      width: 320px; flex: 0 0 320px; border-right: 1px solid var(--line);
      background: var(--panel); padding: 16px; overflow-y: auto;
    }
    .side .group { margin-bottom: 18px; }
    .side .group + .group { border-top: 1px solid var(--line); padding-top: 16px; }
    .side .field + .field { margin-top: 10px; }
    .projects { list-style: none; margin: 8px 0 0; padding: 0; }
    .projects li {
      border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; margin-bottom: 7px; cursor: pointer; background: var(--bg);
    }
    .projects li.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .projects .name { font-weight: 600; }
    .projects .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); word-break: break-all; }
    .projects .project-top { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
    .projects a.open-tab {
      flex: 0 0 auto; color: var(--accent); text-decoration: none; font-size: 12px;
      border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; background: var(--panel);
    }
    .projects a.open-tab:hover { border-color: var(--accent); }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .thread { flex: 1; overflow-y: auto; padding: 20px; }
    .turn { max-width: 820px; margin: 0 auto 16px; }
    .turn .who { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
    .bubble { border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; background: var(--panel); white-space: pre-wrap; }
    .turn.user .bubble { background: var(--panel-soft); }
    .turn.agent .bubble { font-family: var(--mono); font-size: 13px; }
    .turn .status { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .turn .status.bad { color: var(--bad); }
    .empty { max-width: 820px; margin: 40px auto; color: var(--muted); text-align: center; }

    .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 20px; }
    .composer .inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    .composer textarea { min-height: 52px; max-height: 200px; resize: vertical; }
    .composer button { min-width: 92px; }
    .hint { max-width: 820px; margin: 8px auto 0; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="mark"></span><h1>A.G. Console</h1></div>
    <div class="row">
      <span class="pill"><span class="dot" id="healthDot"></span><span id="healthLabel">checking…</span></span>
      <span class="pill" id="projectLabel">no project</span>
      <a class="pill" href="/ui" style="text-decoration:none">gateway</a>
    </div>
  </div>

  <div class="shell">
    <aside class="side">
      <div class="group">
        <label for="token">Gateway token</label>
        <div class="field"><input id="token" type="password" autocomplete="off" placeholder="Bearer token (blank on private net)" /></div>
        <div class="field"><button class="secondary" id="saveToken">Save token</button></div>
      </div>

      <div class="group">
        <label>Projects</label>
        <ul class="projects" id="projects"></ul>
      </div>

      <div class="group">
        <label>New project</label>
        <div class="field"><input id="pName" placeholder="name" /></div>
        <div class="field"><input id="pDir" placeholder="working dir (relative to harness root)" /></div>
        <div class="field">
          <select id="pHarness">
            <option value="claude">claude</option>
            <option value="codex">codex</option>
            <option value="gemini">gemini</option>
          </select>
        </div>
        <div class="field"><button id="createProject">Create project</button></div>
      </div>
    </aside>

    <section class="main">
      <div class="thread" id="thread">
        <div class="empty" id="empty">Pick or create a project, then send a message to start a coding session.</div>
      </div>
      <div class="composer">
        <div class="inner">
          <textarea id="input" placeholder="Tell the agent what to do…" disabled></textarea>
          <button id="send" disabled>Send</button>
        </div>
        <div class="hint" id="hint">Select a project to begin.</div>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const TOKEN_KEY = "moa.gateway.token";
    // One Claude/Codex session id per project, so turns resume the same conversation.
    const sessions = {};
    let projects = [];
    let activeProjectId = "";
    let busy = false;
    const initialProjectId = new URLSearchParams(location.search).get("project") || "";

    $("token").value = localStorage.getItem(TOKEN_KEY) || "";
    function token() { return $("token").value.trim(); }

    async function api(path, options = {}) {
      const headers = Object.assign({ "content-type": "application/json" }, options.headers || {});
      if (token()) headers.authorization = `Bearer ${token()}`;
      const resp = await fetch(path, Object.assign({}, options, { headers }));
      const text = await resp.text();
      let body;
      try { body = text ? JSON.parse(text) : {}; } catch { body = { error: text }; }
      if (!resp.ok) throw new Error(body.error || `${resp.status} ${resp.statusText}`);
      return body;
    }

    function setDot(id, state) { $(id).className = "dot" + (state ? " " + state : ""); }

    async function checkHealth() {
      try {
        const h = await api("/health");
        setDot("healthDot", h.ok ? "ok" : "warn");
        $("healthLabel").textContent = `${h.provider || "gateway"} · ${(h.agent_loop && h.agent_loop.default_harness) || "harness"}`;
      } catch (e) {
        setDot("healthDot", "bad");
        $("healthLabel").textContent = "offline";
      }
    }

    function projectUrl(id) {
      const url = new URL(location.href);
      url.pathname = "/console";
      url.search = "";
      url.searchParams.set("project", id);
      return `${url.pathname}${url.search}`;
    }

    function renderProjects() {
      const ul = $("projects");
      ul.innerHTML = "";
      if (!projects.length) {
        ul.innerHTML = '<li style="cursor:default;border-style:dashed">No projects yet.</li>';
        return;
      }
      for (const p of projects) {
        const li = document.createElement("li");
        if (p.id === activeProjectId) li.className = "active";
        const top = document.createElement("div");
        top.className = "project-top";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = p.name;
        const open = document.createElement("a");
        open.className = "open-tab";
        open.href = projectUrl(p.id);
        open.target = "_blank";
        open.rel = "noopener";
        open.textContent = "Open";
        open.onclick = (event) => event.stopPropagation();
        top.appendChild(name);
        top.appendChild(open);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${p.default_harness} · ${p.working_dir}`;
        li.appendChild(top);
        li.appendChild(meta);
        li.onclick = () => selectProject(p.id);
        ul.appendChild(li);
      }
    }

    async function loadProjects() {
      try {
        const r = await api("/v1/projects");
        projects = r.projects || [];
        renderProjects();
        if (!activeProjectId && initialProjectId && projects.some((p) => p.id === initialProjectId)) {
          selectProject(initialProjectId, { updateUrl: false });
        } else if (initialProjectId && !projects.some((p) => p.id === initialProjectId)) {
          $("hint").textContent = `Unknown project in this tab: ${initialProjectId}`;
        }
      } catch (e) {
        $("hint").textContent = `Could not load projects: ${e.message}`;
      }
    }

    function selectProject(id, options = {}) {
      activeProjectId = id;
      renderProjects();
      const p = projects.find((x) => x.id === id);
      if (options.updateUrl !== false && p) {
        history.replaceState(null, "", projectUrl(id));
      }
      $("projectLabel").textContent = p ? p.name : "no project";
      document.title = p ? `${p.name} · A.G. Console` : "A.G. Console";
      $("input").disabled = false;
      $("send").disabled = false;
      $("hint").textContent = p ? `Working in ${p.working_dir} with ${p.default_harness}.` : "";
      $("input").focus();
    }

    $("createProject").onclick = async () => {
      const name = $("pName").value.trim();
      const working_dir = $("pDir").value.trim();
      const default_harness = $("pHarness").value;
      if (!name || !working_dir) { $("hint").textContent = "Name and working dir are required."; return; }
      try {
        const r = await api("/v1/projects", { method: "POST", body: JSON.stringify({ name, working_dir, default_harness }) });
        $("pName").value = ""; $("pDir").value = "";
        await loadProjects();
        selectProject(r.project.id);
      } catch (e) {
        $("hint").textContent = `Create failed: ${e.message}`;
      }
    };

    $("saveToken").onclick = () => {
      localStorage.setItem(TOKEN_KEY, token());
      checkHealth();
    };

    function addTurn(role, text) {
      $("empty").style.display = "none";
      const wrap = document.createElement("div");
      wrap.className = `turn ${role}`;
      wrap.innerHTML = `<div class="who">${role === "user" ? "you" : "agent"}</div>`
        + `<div class="bubble"></div><div class="status"></div>`;
      wrap.querySelector(".bubble").textContent = text;
      $("thread").appendChild(wrap);
      $("thread").scrollTop = $("thread").scrollHeight;
      return wrap;
    }

    function setStatus(turn, text, bad) {
      const el = turn.querySelector(".status");
      el.textContent = text;
      el.className = "status" + (bad ? " bad" : "");
    }

    async function send() {
      if (busy || !activeProjectId) return;
      const prompt = $("input").value.trim();
      if (!prompt) return;
      busy = true;
      $("send").disabled = true;
      $("input").value = "";
      addTurn("user", prompt);
      const agentTurn = addTurn("agent", "");
      setStatus(agentTurn, "queued…");
      try {
        const body = {
          project_id: activeProjectId,
          prompt,
          wait: false,
          source: "console",
          resume_session_id: sessions[activeProjectId] || "",
        };
        const start = await api("/v1/agent/runs", { method: "POST", body: JSON.stringify(body) });
        const runId = start.run.id;
        const run = await pollRun(runId, agentTurn);
        agentTurn.querySelector(".bubble").textContent = run.output || run.error || "(no output)";
        if (run.session_id) sessions[activeProjectId] = run.session_id;
        setStatus(agentTurn, `${run.harness} · ${run.status}`, run.status !== "completed");
      } catch (e) {
        setStatus(agentTurn, e.message, true);
      } finally {
        busy = false;
        $("send").disabled = false;
        $("thread").scrollTop = $("thread").scrollHeight;
        $("input").focus();
      }
    }

    async function pollRun(runId, turn) {
      const terminal = ["completed", "failed", "canceled", "timed-out"];
      for (;;) {
        const r = await api(`/v1/agent/runs/${runId}`);
        const run = r.run;
        setStatus(turn, `${run.harness} · ${run.status}…`);
        if (terminal.includes(run.status)) return run;
        await new Promise((res) => setTimeout(res, 1500));
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    $("send").onclick = send;
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
    });

    checkHealth();
    loadProjects();
  </script>
</body>
</html>
