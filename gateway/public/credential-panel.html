<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moa credential autopilot</title>
<style>
  /* Parametric: one root scalar cascades to every inner dimension. */
  :root {
    --s: 16px;
    --gap: calc(var(--s) * 0.75);
    --pad: calc(var(--s) * 0.9);
    --radius: calc(var(--s) * 0.6);
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e9ef;
    --muted: #99a1b3;
    --accent: #6ea8fe;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --idle: #8b93a7;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--s);
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  .wrap { max-width: calc(var(--s) * 56); margin: 0 auto; padding: calc(var(--s) * 1.5) var(--pad); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap); margin-bottom: var(--gap); }
  h1 { font-size: calc(var(--s) * 1.35); margin: 0; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; font-size: calc(var(--s) * 0.85); }
  .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: calc(var(--s) * 0.4); padding: calc(var(--s) * 0.2) calc(var(--s) * 0.55); border-radius: 999px; background: var(--panel2); font-size: calc(var(--s) * 0.78); border: 1px solid var(--line); }
  .dot { width: calc(var(--s) * 0.55); height: calc(var(--s) * 0.55); border-radius: 999px; background: var(--idle); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .tokrow { display: flex; flex-wrap: wrap; gap: calc(var(--s) * 0.4); align-items: center; margin-bottom: var(--gap); }
  input[type=password], input[type=text] { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: var(--radius); padding: calc(var(--s) * 0.5) calc(var(--s) * 0.6); font-size: calc(var(--s) * 0.9); min-width: calc(var(--s) * 16); }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: calc(var(--s) * 0.5) calc(var(--s) * 0.8); font-size: calc(var(--s) * 0.85); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { display: flex; flex-wrap: wrap; gap: var(--gap); margin: var(--gap) 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); min-width: calc(var(--s) * 7); }
  .stat b { display: block; font-size: calc(var(--s) * 1.5); font-weight: 600; }
  .stat small { color: var(--muted); font-size: calc(var(--s) * 0.72); text-transform: uppercase; letter-spacing: 0.04em; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); margin-bottom: var(--gap); }
  .card h3 { margin: 0 0 calc(var(--s) * 0.25); font-size: calc(var(--s) * 1.02); font-weight: 600; display: flex; align-items: center; gap: calc(var(--s) * 0.5); flex-wrap: wrap; }
  .status { padding: calc(var(--s) * 0.12) calc(var(--s) * 0.5); border-radius: 999px; font-size: calc(var(--s) * 0.72); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; border: 1px solid transparent; }
  .status.ok { color: var(--ok); border-color: var(--ok); }
  .status.warn { color: var(--warn); border-color: var(--warn); }
  .status.bad { color: var(--bad); border-color: var(--bad); }
  .status.idle { color: var(--idle); border-color: var(--idle); }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--s) * 11), 1fr)); gap: calc(var(--s) * 0.4) var(--gap); margin: calc(var(--s) * 0.5) 0; font-size: calc(var(--s) * 0.82); }
  .meta div span { color: var(--muted); display: block; font-size: calc(var(--s) * 0.68); text-transform: uppercase; letter-spacing: 0.03em; }
  .action { background: var(--panel2); border: 1px solid var(--warn); border-radius: var(--radius); padding: calc(var(--s) * 0.6); margin: calc(var(--s) * 0.5) 0; font-size: calc(var(--s) * 0.86); }
  .action b { color: var(--warn); }
  .rowbtns { display: flex; gap: calc(var(--s) * 0.4); flex-wrap: wrap; margin-top: calc(var(--s) * 0.5); }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: calc(var(--s) * 0.8); }
  .section-title { font-size: calc(var(--s) * 0.78); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: calc(var(--s) * 1.2) 0 calc(var(--s) * 0.5); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: calc(var(--s) * 0.5) var(--pad); }
  summary { cursor: pointer; font-size: calc(var(--s) * 0.9); }
  table { width: 100%; border-collapse: collapse; font-size: calc(var(--s) * 0.82); margin-top: calc(var(--s) * 0.5); }
  th, td { text-align: left; padding: calc(var(--s) * 0.35) calc(var(--s) * 0.4); border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: calc(var(--s) * 0.72); text-transform: uppercase; }
  #err { color: var(--bad); font-size: calc(var(--s) * 0.85); min-height: calc(var(--s) * 1.2); margin: calc(var(--s) * 0.3) 0; }
  .empty { color: var(--muted); padding: var(--pad); text-align: center; }
  .scale { display: flex; align-items: center; gap: calc(var(--s) * 0.3); font-size: calc(var(--s) * 0.75); color: var(--muted); }
  input[type=range] { width: calc(var(--s) * 6); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Credential autopilot <span>gateway-served</span></h1>
    <div class="grow"></div>
    <span class="pill"><span class="dot" id="connDot"></span><span id="connLabel">disconnected</span></span>
    <label class="scale">scale <input id="scale" type="range" min="12" max="22" value="16" /></label>
  </header>

  <div class="tokrow">
    <input id="token" type="password" autocomplete="off" placeholder="Gateway token (Bearer)" />
    <button id="save">Save token</button>
    <button id="clear">Clear</button>
    <div class="grow"></div>
    <button id="reload">Reload</button>
    <button id="health" class="primary">Run health check now</button>
  </div>
  <div id="err"></div>

  <div class="summary" id="summary"></div>

  <div class="section-title">Connections</div>
  <div id="connections"><div class="empty">Enter your gateway token to load connections.</div></div>

  <div class="section-title">Pending device notifications</div>
  <div id="notifications"><div class="empty">None loaded.</div></div>

  <div class="section-title">Provider catalog</div>
  <details id="providersBox"><summary>Show supported providers</summary><div id="providers"></div></details>
</div>

<script>
"use strict";
const TOKEN_KEY = "moa.credential-panel.token";
const $ = (id) => document.getElementById(id);

// --- parametric scale knob ---
$("scale").addEventListener("input", (e) => {
  document.documentElement.style.setProperty("--s", e.target.value + "px");
});

// --- token + fetch ---
$("token").value = localStorage.getItem(TOKEN_KEY) || "";
function token() { return $("token").value.trim(); }
function setConn(state, label) {
  $("connDot").className = "dot " + state;
  $("connLabel").textContent = label;
}
async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (token()) headers.authorization = "Bearer " + token();
  if (options.body) headers["content-type"] = "application/json";
  const resp = await fetch(path, { ...options, headers });
  const text = await resp.text();
  let json = {};
  try { json = text ? JSON.parse(text) : {}; } catch { json = { raw: text }; }
  if (!resp.ok) {
    const message = (json && json.error) ? json.error : (resp.status + " " + resp.statusText);
    const error = new Error(message);
    error.status = resp.status;
    error.payload = json;
    throw error;
  }
  return json;
}

// --- rendering helpers ---
const STATUS_CLASS = {
  connected: "ok", refreshing: "idle", pending_user_auth: "idle",
  action_required: "warn", expired: "bad", invalid: "bad",
  revoked: "bad", disabled: "idle", error: "bad",
};
function statusClass(s) { return STATUS_CLASS[s] || "idle"; }
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function rel(iso) {
  if (!iso) return "—";
  const ms = Date.parse(iso);
  if (!Number.isFinite(ms)) return esc(iso);
  const diff = ms - Date.now();
  const abs = Math.abs(diff);
  const mins = Math.round(abs / 60000);
  const hrs = Math.round(abs / 3600000);
  const days = Math.round(abs / 86400000);
  let human;
  if (mins < 1) human = "now";
  else if (mins < 60) human = mins + "m";
  else if (hrs < 48) human = hrs + "h";
  else human = days + "d";
  const when = diff >= 0 ? "in " + human : human + " ago";
  return when + " (" + esc(new Date(ms).toLocaleString()) + ")";
}

// --- data load ---
let NOTIF_BY_CONN = {};
async function loadAll() {
  if (!token()) { setConn("bad", "token required"); return; }
  $("err").textContent = "";
  setConn("idle", "loading…");
  try {
    const [prov, conns, notifs] = await Promise.all([
      api("/v1/account-providers"),
      api("/v1/account-connections"),
      api("/v1/account-connections/notifications"),
    ]);
    setConn("ok", "connected");
    NOTIF_BY_CONN = {};
    for (const n of (notifs.notifications || [])) {
      (NOTIF_BY_CONN[n.connection_id] = NOTIF_BY_CONN[n.connection_id] || []).push(n);
    }
    renderProviders(prov.providers || []);
    renderConnections(conns.connections || []);
    renderNotifications(notifs.notifications || []);
    renderSummary(conns.connections || [], notifs.notifications || []);
  } catch (e) {
    setConn("bad", "error");
    $("err").textContent = e.status === 401 ? "Unauthorized: check the gateway token." : ("Load failed: " + e.message);
  }
}

function renderSummary(conns, notifs) {
  const needs = conns.filter((c) => c.needs_user_action).length;
  const connected = conns.filter((c) => c.status === "connected").length;
  const queued = notifs.filter((n) => n.status === "queued").length;
  const dispatched = notifs.filter((n) => n.tool_request_id).length;
  const stats = [
    ["Connections", conns.length, "idle"],
    ["Connected", connected, "ok"],
    ["Need action", needs, needs ? "bad" : "idle"],
    ["Notifs queued", queued, queued ? "warn" : "idle"],
    ["Device-pinged", dispatched, "idle"],
  ];
  $("summary").innerHTML = stats.map(([label, n, cls]) =>
    '<div class="stat"><b class="' + cls + '">' + n + "</b><small>" + esc(label) + "</small></div>"
  ).join("");
}

function renderConnections(conns) {
  if (!conns.length) {
    $("connections").innerHTML = '<div class="empty">No connections yet. Start one with <span class="mono">POST /v1/account-connections</span>.</div>';
    return;
  }
  $("connections").innerHTML = conns.map(renderConnectionCard).join("");
}

function renderConnectionCard(c) {
  const r = c.refresh || {};
  const notif = (NOTIF_BY_CONN[c.id] || []).find((n) => n.status === "queued") || (NOTIF_BY_CONN[c.id] || [])[0];
  let actionBlock = "";
  if (c.needs_user_action && c.user_action) {
    actionBlock = '<div class="action"><b>Needs you.</b> ' + esc(c.user_action.message) +
      (notif && notif.tool_request_id
        ? ' <span class="muted">· device pinged (' + esc(notif.tool_request_id) + ", " + esc(notif.status) + ")</span>"
        : notif ? ' <span class="muted">· notification ' + esc(notif.status) + "</span>" : "") +
      "</div>";
  }
  const target = c.device_notification_target;
  const meta = [
    ["Credential", esc(c.credential_kind) + ' <span class="muted">(' + esc(c.credential_ref_kind) + ")</span>"],
    ["Expires", rel(c.expires_at)],
    ["Last refresh", rel(r.last_success_at)],
    ["Refresh", esc(r.state) + (r.supported ? "" : " (unsupported)") + (r.failure_code ? ' · <span class="bad">' + esc(r.failure_code) + "</span>" : "")],
    ["Notify target", target && target.device_id ? esc(target.device_id) + " / " + esc(target.channel) : '<span class="muted">none</span>'],
    ["Last checked", rel(c.audit && c.audit.last_health_check_at)],
  ];
  return '<div class="card">' +
    "<h3>" + esc(c.provider_label) + ' <span class="muted">·</span> ' + esc(c.label) +
    ' <span class="status ' + statusClass(c.status) + '">' + esc(c.status) + "</span></h3>" +
    (c.account_subject && c.account_subject.display ? '<div class="muted mono">' + esc(c.account_subject.display) + "</div>" : "") +
    actionBlock +
    '<div class="meta">' + meta.map(([k, v]) => "<div><span>" + esc(k) + "</span>" + v + "</div>").join("") + "</div>" +
    '<div class="rowbtns">' +
      (r.supported ? '<button data-refresh="' + esc(c.id) + '">Refresh now</button>' : "") +
      '<button data-reauth="' + esc(c.id) + '">Reauthorize</button>' +
    "</div></div>";
}

function renderNotifications(notifs) {
  if (!notifs.length) { $("notifications").innerHTML = '<div class="empty">No device notifications.</div>'; return; }
  const rows = notifs.map((n) =>
    "<tr><td class=mono>" + esc(n.connection_label || n.connection_id) + "</td>" +
    "<td>" + esc(n.input && n.input.reason) + "</td>" +
    "<td>" + esc(n.device_id) + " / " + esc(n.channel) + "</td>" +
    '<td><span class="status ' + (n.status === "queued" ? "warn" : n.status === "received" ? "ok" : "idle") + '">' + esc(n.status) + "</span></td>" +
    '<td class="mono">' + (n.tool_request_id ? esc(n.tool_request_id) : '<span class="muted">—</span>') + "</td></tr>"
  ).join("");
  $("notifications").innerHTML = '<table><thead><tr><th>Connection</th><th>Reason</th><th>Target</th><th>Status</th><th>Tool request</th></tr></thead><tbody>' + rows + "</tbody></table>";
}

function renderProviders(providers) {
  if (!providers.length) { $("providers").innerHTML = '<div class="empty">None.</div>'; return; }
  const rows = providers.map((p) =>
    "<tr><td class=mono>" + esc(p.id) + "</td><td>" + esc(p.label) + "</td>" +
    "<td>" + esc((p.credential_kinds || []).join(", ")) + "</td>" +
    "<td>" + (p.supports_refresh ? "yes" : "no") + "</td>" +
    "<td>" + (p.supports_multiple_connections ? "yes" : "no") + "</td></tr>"
  ).join("");
  $("providers").innerHTML = '<table><thead><tr><th>id</th><th>label</th><th>credential kinds</th><th>refresh</th><th>multi</th></tr></thead><tbody>' + rows + "</tbody></table>";
}

// --- actions (event delegation) ---
$("connections").addEventListener("click", async (e) => {
  const refreshId = e.target.getAttribute("data-refresh");
  const reauthId = e.target.getAttribute("data-reauth");
  if (!refreshId && !reauthId) return;
  e.target.disabled = true;
  try {
    if (refreshId) {
      await api("/v1/account-connections/" + refreshId + "/refresh", { method: "POST", body: "{}" });
    } else if (reauthId) {
      const res = await api("/v1/account-connections/" + reauthId + "/reauth", { method: "POST", body: "{}" });
      const url = res && res.reauth_action && res.reauth_action.url;
      if (url) window.open(url, "_blank", "noopener");
    }
  } catch (err) {
    $("err").textContent = "Action failed: " + err.message;
  } finally {
    await loadAll();
  }
});

$("health").addEventListener("click", async () => {
  if (!token()) { $("err").textContent = "Token required."; return; }
  $("health").disabled = true;
  try {
    const res = await api("/v1/account-connections/health/run", { method: "POST", body: "{}" });
    const s = res.summary || {};
    $("err").textContent = "Health run: checked " + (s.checked || 0) + ", refreshed " + (s.refreshed || 0) +
      ", refresh_failed " + (s.refresh_failed || 0) + ", notifications " + (s.notifications_queued || 0) + ".";
  } catch (err) {
    $("err").textContent = "Health run failed: " + err.message;
  } finally {
    $("health").disabled = false;
    await loadAll();
  }
});

$("save").addEventListener("click", () => { localStorage.setItem(TOKEN_KEY, token()); loadAll(); });
$("clear").addEventListener("click", () => { localStorage.removeItem(TOKEN_KEY); $("token").value = ""; setConn("bad", "token required"); });
$("reload").addEventListener("click", loadAll);
$("token").addEventListener("keydown", (e) => { if (e.key === "Enter") { localStorage.setItem(TOKEN_KEY, token()); loadAll(); } });

if (token()) loadAll(); else setConn("bad", "token required");
</script>
</body>
</html>
