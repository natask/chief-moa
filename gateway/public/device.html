<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Connect Ag</title>
<style>
  :root{color-scheme:light dark;font:16px system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111318;color:#f4f5f7}.card{width:min(430px,calc(100% - 40px));padding:28px;border:1px solid #343842;border-radius:22px;background:#1b1e25}h1{margin:0 0 8px}p{color:#aeb4c0}.code{font:700 28px ui-monospace,monospace;letter-spacing:3px;color:#fff}button{font:inherit;padding:12px 18px;border-radius:12px;border:1px solid #444b58;cursor:pointer;font-weight:650}.approve{background:#eef0ff;color:#171922}.deny{background:transparent;color:#eef0ff}#status{min-height:22px;color:#f3aaae}
</style>
<main class="card">
  <h1>Connect Ag</h1><p>Approve this only if you just started sign-in from your Ag app.</p>
  <p class="code" id="code"></p>
  <button class="approve" id="approve">Connect device</button>
  <button class="deny" id="deny">Deny</button>
  <p id="status" role="status"></p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const userCode = (params.get('user_code') || '').replace(/-/g,'').toUpperCase();
  code.textContent = userCode || 'Missing code';
  async function session() { return fetch('/api/auth/get-session',{credentials:'include'}).then(r=>r.json()).catch(()=>null); }
  async function prepare() {
    const current = await session();
    if (!current?.user) {
      const back = '/device?user_code=' + encodeURIComponent(userCode);
      location.replace('/sign-in?return=' + encodeURIComponent(back)); return;
    }
    const response = await fetch('/api/auth/device?user_code=' + encodeURIComponent(userCode), {credentials:'include'});
    if (!response.ok) status.textContent = 'This code is invalid or expired.';
  }
  async function decide(action) {
    approve.disabled = deny.disabled = true;
    const response = await fetch('/api/auth/device/' + action, {method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({userCode})});
    if (response.ok) { status.style.color='#9de3b0'; status.textContent = action === 'approve' ? 'Ag is connected. You can close this window.' : 'Request denied.'; }
    else { approve.disabled = deny.disabled = false; status.textContent = 'Could not update this request.'; }
  }
  approve.addEventListener('click',()=>decide('approve')); deny.addEventListener('click',()=>decide('deny')); prepare();
</script>
