<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEG — Confirm media action</title>
    <link rel="stylesheet" href="media-confirm.css" />
    <script src="media-confirm.js" defer></script>
  </head>
  <body>
    <main>
      <span class="boundary">EXTENSION-OWNED CONFIRMATION</span>
      <h1>Allow this media action?</h1>
      <p>The web page cannot change this disclosure or press Allow.</p>
      <section><p id="disclosure">Loading immutable details…</p></section>
      <dl>
        <dt>Operation</dt><dd id="operation">—</dd>
        <dt>Label</dt><dd id="label">—</dd>
        <dt>Search query</dt><dd id="query">—</dd>
        <dt>Exact title</dt><dd id="title">—</dd>
        <dt>Exact channel</dt><dd id="channel">—</dd>
        <dt>Video ID</dt><dd id="video-id">—</dd>
        <dt>Position</dt><dd id="position">—</dd>
        <dt>Note</dt><dd id="note">—</dd>
        <dt>SHA-256 binding</dt><dd id="digest" class="digest">—</dd>
      </dl>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="allow" class="primary" type="button" disabled>Allow once</button>
      </div>
    </main>
  </body>
</html>
