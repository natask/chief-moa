<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A.G.</title>
    <style>
      :root {
        --bg: #101114;
        --panel: #17181d;
        --border: #2b2e36;
        --text: #f4f4f5;
        --muted: #b8bac0;
        --accent: #d6e2ff;
        --listening: #f0b429;
        --speaking: #7bd88f;
        --error: #ff8080;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
      }
      header {
        align-items: center;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 10px;
        padding: 12px 14px;
      }
      header .mark {
        align-items: center;
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        font-size: 12px;
        font-weight: 700;
        height: 26px;
        justify-content: center;
        letter-spacing: 0.04em;
        width: 34px;
      }
      header .status {
        color: var(--muted);
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header .status[data-state="listening"] {
        color: var(--listening);
      }
      header .status[data-state="speaking"] {
        color: var(--speaking);
      }
      header .status[data-state="error"] {
        color: var(--error);
      }
      header .spacer {
        flex: 1;
      }
      #floatBtn {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      #floatBtn:hover {
        color: var(--text);
      }
      .floating-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        padding: 14px;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .hint code {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--accent);
        padding: 1px 5px;
      }
      #history[data-stale="true"] {
        opacity: 0.72;
      }
      #historyError {
        align-items: flex-start;
        background: #24191b;
        border: 1px solid #5b2b2b;
        border-radius: 10px;
        color: var(--error);
        display: flex;
        font-size: 12px;
        gap: 10px;
        justify-content: space-between;
        line-height: 1.4;
        margin-bottom: 14px;
        padding: 9px 10px;
      }
      #historyError[hidden] {
        display: none;
      }
      #historyRetry {
        background: transparent;
        border: 1px solid #7b3b3b;
        border-radius: 7px;
        color: var(--error);
        cursor: pointer;
        flex: 0 0 auto;
        font: inherit;
        padding: 4px 8px;
      }
      .history-message {
        margin-bottom: 12px;
      }
      .history-message .speaker {
        color: #6d7078;
        font-size: 11px;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
        text-transform: lowercase;
      }
      .history-message .body {
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .history-message[data-speaker="user"] .body {
        color: var(--muted);
      }
      .history-message[data-speaker="assistant"] .body {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .history-message .meta {
        color: #777a82;
        font-size: 10px;
        margin-top: 4px;
      }
      .turn {
        margin-bottom: 14px;
      }
      .turn .you {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 4px;
        white-space: pre-wrap;
      }
      .turn .you::before {
        color: #6d7078;
        content: "you  ";
        font-size: 11px;
        letter-spacing: 0.05em;
      }
      .turn .ag {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
        padding: 10px 12px;
        white-space: pre-wrap;
      }
      .turn .ag.pending {
        color: var(--muted);
      }
      .turn .ag.error {
        border-color: #5b2b2b;
        color: var(--error);
      }
      .microphone-recovery-action {
        display: block;
        margin-top: 10px;
        padding: 8px 11px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .turn .ag.confirming { background: #1b1d22; }
      .delegation-confirm-copy { margin: 0; }
      .delegation-confirm-actions { display: flex; gap: 8px; margin-top: 12px; }
      .delegation-confirm-actions button {
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        padding: 7px 9px;
      }
      .delegation-confirm-actions button { background: var(--text); color: #111; }
      .delegation-confirm-actions button.secondary { background: transparent; color: var(--muted); }
      footer {
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
      }
      #talk {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        padding: 14px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        width: 100%;
      }
      #talk[data-state="listening"] {
        background: #2a2413;
        border-color: var(--listening);
        color: var(--listening);
      }
      #talk[data-state="busy"] {
        color: var(--muted);
        cursor: default;
      }
      form {
        display: flex;
        gap: 8px;
      }
      #text {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        flex: 1;
        font: inherit;
        font-size: 13px;
        min-width: 0;
        padding: 9px 11px;
      }
      #text:focus {
        border-color: #4a4f5a;
        outline: none;
      }
      #sendBtn {
        background: var(--text);
        border: 0;
        border-radius: 10px;
        color: #111;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        padding: 9px 14px;
      }
      #sendBtn:disabled {
        background: #3a3d45;
        color: #8a8d94;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="mark">A.G.</div>
      <div class="status" id="status">Ready.</div>
      <div class="spacer"></div>
      <button id="floatBtn" type="button" title="Pop A.G. out into an always-on-top floating window">Float</button>
    </header>
    <main>
      <p class="hint">
        This panel is A.G.'s own surface. It works on every page, including
        <code>chrome://</code> pages where the in-page overlay cannot run, and it
        stays open while you switch tabs. Hold the button (or hold
        <code>Space</code>) to talk, release to send. Type below for a text turn.
      </p>
      <div id="historyError" role="status" hidden>
        <span id="historyErrorText"></span>
        <button id="historyRetry" type="button">Retry</button>
      </div>
      <section id="history" aria-label="Saved conversation history"></section>
      <section id="log" aria-label="Current interaction"></section>
    </main>
    <footer>
      <button id="talk" type="button" data-state="idle">Hold to talk</button>
      <form id="form">
        <input id="text" type="text" placeholder="Type to A.G." autocomplete="off" />
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </footer>
    <script src="sidepanel.js"></script>
  </body>
</html>
