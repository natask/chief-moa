<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ag</title>
    <style>
      :root {
        --bg: #101114;
        --panel: #17181d;
        --border: #2b2e36;
        --text: #f4f4f5;
        --muted: #b8bac0;
        --accent: #d6e2ff;
        --listening: #f0b429;
        --speaking: #7bd88f;
        --error: #ff8080;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
      }
      header {
        align-items: center;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 10px;
        padding: 12px 14px;
      }
      header .mark {
        align-items: center;
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        gap: 7px;
        font-size: 12px;
        font-weight: 700;
        height: 26px;
        justify-content: center;
        letter-spacing: 0.04em;
        max-width: 150px;
        min-width: 34px;
        overflow: hidden;
        padding: 2px 7px 2px 3px;
      }
      header .mark img {
        flex: 0 0 auto;
        height: 22px;
        object-fit: contain;
        width: 22px;
      }
      header .mark span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header .status {
        color: var(--muted);
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header .status[data-state="listening"] {
        color: var(--listening);
      }
      header .status[data-state="speaking"] {
        color: var(--speaking);
      }
      header .status[data-state="error"] {
        color: var(--error);
      }
      header .spacer {
        flex: 1;
      }
      #floatBtn {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        white-space: nowrap;
      }
      #floatBtn:hover {
        color: var(--text);
      }
      .floating-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        padding: 14px;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
      }
      .section-title {
        color: #6d7078;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin: 0 0 8px;
        text-transform: uppercase;
      }
      .section-title:has(+ section:empty) {
        display: none;
      }
      /* sidepanel.js renders newest turns first in DOM order, so visual
         order and DOM order agree. */
      #log,
      #history {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
      }
      #log {
        gap: 14px;
      }
      #history {
        gap: 12px;
      }
      #log:empty,
      #history:empty {
        display: none;
      }
      #history[data-stale="true"] {
        opacity: 0.72;
      }
      .captured-intents-head {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
      }
      .captured-intents-head button,
      .video-intent-actions button {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        padding: 5px 8px;
      }
      #capturedIntents {
        display: grid;
        gap: 10px;
        margin-bottom: 16px;
      }
      .video-intent-card {
        background: #121318;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: grid;
        gap: 8px;
        padding: 10px;
      }
      .video-intent-meta,
      .video-intent-provenance,
      #capturedIntentsStatus {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .video-intent-status {
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .video-intent-card textarea {
        background: #17181d;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        line-height: 1.45;
        min-height: 96px;
        padding: 8px;
        resize: vertical;
        width: 100%;
      }
      .video-intent-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .video-intent-actions .delete {
        color: var(--error);
      }
      .video-intent-card video {
        max-height: 240px;
        width: 100%;
      }
      .video-intent-history {
        color: var(--muted);
        font-size: 11px;
      }
      .video-intent-history ol {
        margin: 7px 0 0;
        padding-left: 18px;
      }
      .video-intent-source {
        background: #17181d;
        border-radius: 7px;
        color: var(--text);
        font-family: inherit;
        margin: 8px 0 0;
        max-height: 180px;
        overflow: auto;
        padding: 8px;
        white-space: pre-wrap;
      }
      #historyError {
        align-items: flex-start;
        background: #24191b;
        border: 1px solid #5b2b2b;
        border-radius: 10px;
        color: var(--error);
        display: flex;
        font-size: 12px;
        gap: 10px;
        justify-content: space-between;
        line-height: 1.4;
        margin-bottom: 14px;
        padding: 9px 10px;
      }
      #historyError[hidden] {
        display: none;
      }
      #historyRetry {
        background: transparent;
        border: 1px solid #7b3b3b;
        border-radius: 7px;
        color: var(--error);
        cursor: pointer;
        flex: 0 0 auto;
        font: inherit;
        padding: 4px 8px;
      }
      /* One recording = one scannable card (article.history-turn) holding its
         nested section.history-message rows. */
      .history-turn {
        background: #121318;
        border: 1px solid var(--border);
        border-radius: 12px;
        display: grid;
        gap: 10px;
        padding: 10px;
      }
      .latest-voice-turn {
        border-color: #566089;
        box-shadow: 0 0 0 1px rgba(214, 226, 255, 0.07);
      }
      .history-message {
        margin-bottom: 0;
        position: relative;
      }
      .history-message .speaker {
        color: #6d7078;
        font-size: 11px;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
        text-transform: lowercase;
      }
      .history-message .body {
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        user-select: text;
        white-space: pre-wrap;
      }
      .history-message[data-speaker="user"] .body {
        background: #1b1d22;
        border: 1px solid #3a4152;
        border-radius: 10px;
        color: var(--text);
        padding: 10px 12px;
      }
      .history-message[data-speaker="assistant"] .body {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .history-message .meta {
        color: #777a82;
        font-size: 10px;
        margin-top: 4px;
      }
      /* Per-row exact Copy and Re-transcribe controls created by
         sidepanel.js. Always visible so touch and no-hover devices can use
         them; hover and focus only brighten. */
      .history-copy,
      .history-retranscribe {
        align-items: center;
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-size: 11px;
        gap: 4px;
        margin-right: 6px;
        margin-top: 6px;
        min-height: 24px;
        padding: 3px 9px;
      }
      .history-copy:hover,
      .history-retranscribe:hover,
      .history-copy:focus-visible,
      .history-retranscribe:focus-visible {
        border-color: #4a4f5a;
        color: var(--text);
      }
      .history-copy[data-copied="true"] {
        border-color: var(--speaking);
        color: var(--speaking);
      }
      /* Transcript revisions read as an inward three-dimensional stack:
         chronological original then revisions, with the selected revision
         raised visibly on top of the receding ones. */
      .history-transcript-revision {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-top: -6px;
        opacity: 0.62;
        padding: 8px 11px;
        position: relative;
        transform: scale(0.985);
        transform-origin: top center;
      }
      .history-transcript-revision:first-child {
        margin-top: 0;
      }
      .history-transcript-revision[data-selected="true"] {
        border-color: #566089;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        opacity: 1;
        transform: none;
        z-index: 1;
      }
      .revision-label {
        color: #777a82;
        font-size: 10px;
        letter-spacing: 0.06em;
        margin-bottom: 3px;
        text-transform: uppercase;
      }
      .history-transcript-revision[data-selected="true"] .revision-label {
        color: var(--accent);
      }
      /* The final transcript of the newest recording is the loudest text in
         History. */
      .latest-voice-transcript,
      .latest-voice-transcript .body {
        color: var(--text);
        font-size: 15px;
        line-height: 1.55;
      }
      .turn {
        margin-bottom: 0;
      }
      /* The final user transcript is the loudest element of a turn: one
         deliberate dark bubble, full text color, body-size type. */
      .turn .you {
        background: #1b1d22;
        border: 1px solid #3a4152;
        border-radius: 10px;
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 6px;
        padding: 10px 12px;
        user-select: text;
        white-space: pre-wrap;
      }
      .turn .you::before {
        color: #6d7078;
        content: "you";
        display: block;
        font-size: 11px;
        letter-spacing: 0.05em;
        margin-bottom: 2px;
      }
      .turn .ag {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
        padding: 10px 12px;
        white-space: pre-wrap;
      }
      .turn .ag.pending {
        color: var(--muted);
      }
      .turn .ag.pending::after {
        content: "";
        display: inline-block;
        width: 0.45em;
        height: 0.45em;
        margin-left: 0.45em;
        border-radius: 50%;
        background: var(--accent);
        animation: pending-pulse 1.1s ease-in-out infinite;
        vertical-align: 0.08em;
      }
      @keyframes pending-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      .turn .ag.error {
        border-color: #5b2b2b;
        color: var(--error);
      }
      .microphone-recovery-action {
        display: block;
        margin-top: 10px;
        padding: 8px 11px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .turn .ag.confirming { background: #1b1d22; }
      .delegation-confirm-copy { margin: 0; }
      .delegation-confirm-actions { display: flex; gap: 8px; margin-top: 12px; }
      .delegation-confirm-actions button {
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        padding: 7px 9px;
      }
      .delegation-confirm-actions button { background: var(--text); color: #111; }
      .delegation-confirm-actions button.secondary { background: transparent; color: var(--muted); }
      .advanced {
        border-top: 1px solid var(--border);
        margin-top: 2px;
        padding-top: 10px;
      }
      .advanced > summary {
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0.03em;
        padding: 4px 0;
        user-select: none;
      }
      .advanced > summary:hover {
        color: var(--text);
      }
      .advanced[open] > summary {
        margin-bottom: 12px;
      }
      .release-cockpit {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 14px;
        padding: 12px;
      }
      .browser-tools {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 14px;
        padding: 12px;
      }
      .browser-tools header { border: 0; padding: 0; }
      .browser-tools h2 { font-size: 13px; margin: 0; }
      .browser-tools button { background: #1b1d22; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; padding: 5px 8px; }
      .browser-tools p { color: var(--muted); font-size: 11px; line-height: 1.45; }
      .browser-tools ul { display: grid; gap: 7px; list-style: none; margin: 0; padding: 0; }
      .browser-tools li { display: grid; gap: 2px; }
      .browser-tools code { color: var(--accent); font-size: 11px; overflow-wrap: anywhere; }
      .browser-tools li span { color: #777a82; font-size: 10px; }
      .release-cockpit h2 {
        font-size: 13px;
        margin: 0;
      }
      .release-cockpit-head {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }
      .release-cockpit button,
      .release-cockpit select,
      .release-cockpit textarea {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
      }
      .release-cockpit button {
        cursor: pointer;
        padding: 6px 9px;
      }
      .release-cockpit button:disabled {
        color: #777a82;
        cursor: default;
      }
      .release-cockpit select,
      .release-cockpit textarea {
        padding: 8px;
        width: 100%;
      }
      .release-cockpit textarea {
        min-height: 70px;
        resize: vertical;
      }
      .release-error,
      .release-pending {
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.45;
        margin-top: 10px;
        padding: 8px 9px;
      }
      .release-error {
        background: #24191b;
        border: 1px solid #5b2b2b;
        color: var(--error);
      }
      .release-pending {
        background: #211f18;
        border: 1px solid #5b5130;
        color: #e8d68b;
      }
      .release-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
        margin-top: 10px;
      }
      .release-card {
        background: #121318;
        border: 1px solid var(--border);
        border-radius: 8px;
        min-width: 0;
        padding: 8px;
      }
      .release-card[data-current="true"] {
        border-color: #7182ad;
      }
      .release-card-title {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .release-card-value,
      .release-binding {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .release-card-meta,
      .release-feedback-binding {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .release-controls {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .release-actions {
        display: flex;
        gap: 8px;
      }
      .release-actions button {
        flex: 1;
      }
      .release-feedback {
        border-top: 1px solid var(--border);
        display: grid;
        gap: 7px;
        margin-top: 10px;
        padding-top: 10px;
      }
      #releaseNotice[hidden],
      #releaseError[hidden],
      #releaseContent[hidden] {
        display: none;
      }
      footer {
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
      }
      #talk {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        padding: 12px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        width: 100%;
      }
      #talk[data-state="listening"] {
        background: #2a2413;
        border-color: var(--listening);
        color: var(--listening);
      }
      #talk[data-state="busy"] {
        color: var(--muted);
        cursor: default;
      }
      form {
        display: flex;
        gap: 8px;
      }
      #text {
        background: #1b1d22;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        flex: 1;
        font: inherit;
        font-size: 13px;
        min-width: 0;
        padding: 9px 11px;
      }
      #text:focus {
        border-color: #4a4f5a;
        outline: none;
      }
      #sendBtn {
        background: var(--text);
        border: 0;
        border-radius: 10px;
        color: #111;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        padding: 9px 14px;
      }
      #sendBtn:disabled {
        background: #3a3d45;
        color: #8a8d94;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="mark" id="companionIdentity" aria-label="Ag companion">
        <img id="companionIdentityImage" src="moa-mark.png" alt="" />
        <span id="companionIdentityName">Ag</span>
      </div>
      <div class="status" id="status">Ready.</div>
      <div class="spacer"></div>
      <button id="floatBtn" type="button" title="Pop Ag out into an always-on-top floating window">Float</button>
    </header>
    <main>
      <h2 class="section-title" id="nowTitle">Now</h2>
      <section id="log" aria-labelledby="nowTitle"></section>
      <div class="captured-intents-head">
        <h2 class="section-title" id="capturedIntentsTitle">Captured intents</h2>
        <button id="capturedIntentsRefresh" type="button">Refresh</button>
      </div>
      <div id="capturedIntentsStatus" role="status"></div>
      <section id="capturedIntents" aria-labelledby="capturedIntentsTitle"></section>
      <h2 class="section-title" id="historyTitle">History</h2>
      <div id="historyError" role="status" hidden>
        <span id="historyErrorText"></span>
        <button id="historyRetry" type="button">Retry</button>
      </div>
      <section id="history" aria-labelledby="historyTitle"></section>
      <details class="advanced">
        <summary>Advanced: releases &amp; browser tools</summary>
      <section class="release-cockpit" aria-labelledby="releaseCockpitTitle">
        <div class="release-cockpit-head">
          <h2 id="releaseCockpitTitle">Release cockpit</h2>
          <button id="releaseRefresh" type="button">Refresh</button>
        </div>
        <div id="releaseError" class="release-error" role="alert" hidden></div>
        <div id="releaseNotice" class="release-pending" role="status" hidden></div>
        <div id="releaseContent" hidden>
          <div id="releaseCards" class="release-grid"></div>
          <div class="release-controls">
            <select id="releaseCandidate" aria-label="Choose an exact release"></select>
            <div class="release-actions">
              <button id="releaseAssign" type="button">Use selected release</button>
              <button id="releaseFallback" type="button">Return to stable</button>
            </div>
          </div>
          <form id="releaseFeedbackForm" class="release-feedback">
            <div id="releaseFeedbackBinding" class="release-feedback-binding"></div>
            <textarea id="releaseFeedbackText" maxlength="4000" placeholder="Comment on this exact release" required></textarea>
            <button id="releaseFeedbackSubmit" type="submit">Send release-bound feedback</button>
          </form>
        </div>
      </section>
      <section class="browser-tools" aria-labelledby="browserToolsTitle">
        <header>
          <h2 id="browserToolsTitle">Browser tools</h2>
          <div class="spacer"></div>
          <button id="browserToolRefresh" type="button">Refresh</button>
        </header>
        <p id="browserToolStatus">Reading browser capabilities…</p>
        <ul id="browserToolList"></ul>
      </section>
      </details>
    </main>
    <footer>
      <button id="talk" type="button" data-state="idle" title="Hold to talk (or hold Space); release to send. Works on every page, even chrome:// pages.">Hold to talk</button>
      <form id="form">
        <input id="text" type="text" placeholder="Type to Ag" autocomplete="off" />
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
