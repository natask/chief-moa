<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent Loop Fixture</title>
    <style>
      body {
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 40px auto;
        max-width: 640px;
        padding: 0 20px;
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }
      input,
      button {
        font: inherit;
        padding: 10px 12px;
      }
      input {
        width: min(380px, 100%);
      }
      #status {
        border-top: 1px solid #ddd;
        margin-top: 24px;
        padding-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Agent Loop Fixture</h1>
    <p>Background agent-loop smoke target: one button that mutates the DOM, one text input.</p>

    <button id="poke" type="button">Poke the box</button>

    <p>
      <!-- No placeholder: the content script's label() prefers placeholder over
           value, so a placeholder would hide the typed value from observations. -->
      <label for="field">Note field</label>
      <input id="field" name="field" />
    </p>

    <div id="status">status: idle</div>

    <script>
      // The button click writes a unique marker so a later observation's
      // page_text proves the click actually mutated the DOM.
      document.getElementById("poke").addEventListener("click", () => {
        document.getElementById("status").textContent = "status: poked-4271";
      });
    </script>
  </body>
</html>
