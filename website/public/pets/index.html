<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A.G. Pet Studio</title>
<meta name="description" content="Customize A.G. companion pets." />
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,650&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#fbfaf7;
    --panel:#ffffff;
    --ink:#17191d;
    --muted:#6d7179;
    --line:#d9d5ca;
    --signal:#e5482b;
    --blue:#2f67d8;
    --green:#208553;
    --violet:#7651c7;
    --amber:#c57a1b;
    --teal:#0e7d85;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --serif:"Fraunces",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
  body{font-family:var(--serif);letter-spacing:0;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  .shell{min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .topbar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:0 22px;border-bottom:1px solid var(--line);background:rgba(251,250,247,.92)}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:12px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .brand img{width:30px;height:30px;object-fit:contain}
  .topbar a{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none}
  .topbar a:hover{color:var(--signal)}

  .workspace{display:grid;grid-template-columns:280px minmax(360px,1fr) 330px;min-height:0}
  .rail,.inspector{background:var(--panel);border-right:1px solid var(--line);min-height:calc(100vh - 64px);overflow:auto}
  .inspector{border-right:0;border-left:1px solid var(--line)}
  .pane-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
  .pane-head h1,.pane-head h2{margin:0;font-size:21px;line-height:1;font-weight:500}
  .pane-head h2{font-size:18px}
  .status{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.35}
  .search{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .search input,.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:6px;padding:10px 11px;outline:none;font-family:var(--mono);font-size:13px;line-height:1.4}
  .search input:focus,.field input:focus,.field textarea:focus{border-color:rgba(229,72,43,.68)}
  .catalog{padding:10px;display:grid;gap:8px}
  .pet-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;align-items:center;width:100%;
    border:1px solid transparent;border-radius:8px;background:transparent;color:inherit;padding:8px;text-align:left}
  .pet-row:hover{border-color:var(--line);background:#fbfaf7}
  .pet-row.active{border-color:rgba(229,72,43,.55);background:#fff6f2}
  .mini{width:42px;height:42px;border-radius:7px;display:grid;place-items:center;background:#f2f0ea;overflow:hidden}
  .mini .mini-dot{width:26px;height:30px;border:1px solid rgba(0,0,0,.22);border-radius:13px 13px 10px 10px;background:var(--blue);position:relative}
  .mini .mini-dot:before,.mini .mini-dot:after{content:"";position:absolute;top:8px;width:4px;height:4px;border-radius:50%;background:#fff}
  .mini .mini-dot:before{left:7px}.mini .mini-dot:after{right:7px}
  .pet-row strong{display:block;font-size:15px;font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pet-row span{display:block;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .stage-wrap{min-height:0;display:grid;grid-template-rows:54px minmax(0,1fr) 118px}
  .stage-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;border-bottom:1px solid var(--line)}
  .selected-title{min-width:0}
  .selected-title strong{display:block;font-size:22px;font-weight:500;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selected-title span{display:block;margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage-actions{display:flex;gap:8px;align-items:center}
  .icon-btn,.cmd{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:0 12px}
  .cmd.primary{background:var(--signal);border-color:var(--signal);color:#fff}
  .cmd:disabled{opacity:.5;cursor:default}
  .stage{position:relative;overflow:hidden;background:
    linear-gradient(#f5f2eb 1px,transparent 1px),
    linear-gradient(90deg,#f5f2eb 1px,transparent 1px),#fbfaf7;
    background-size:44px 44px;touch-action:none}
  .floor{position:absolute;left:0;right:0;bottom:64px;height:1px;background:#c9c3b7}
  .edge{position:absolute;background:rgba(23,25,29,.08)}
  .edge.top{left:0;right:0;top:0;height:1px}.edge.left{left:0;top:0;bottom:0;width:1px}.edge.right{right:0;top:0;bottom:0;width:1px}
  .pet{position:absolute;left:0;top:0;width:96px;height:96px;touch-action:none;user-select:none;will-change:transform;--pet:#2f67d8;--pet-dark:#173778}
  .pet.dragging{filter:drop-shadow(0 16px 18px rgba(0,0,0,.16))}
  .pet-shadow{position:absolute;left:23px;bottom:5px;width:50px;height:9px;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(2px)}
  .pet-core{position:absolute;left:16px;top:16px;width:64px;height:70px}
  .pet-body{position:absolute;left:12px;top:10px;width:40px;height:48px;border-radius:20px 20px 15px 15px;
    border:2px solid rgba(0,0,0,.32);background:var(--pet);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
  .pet-face{position:absolute;left:20px;top:25px;width:24px;height:10px}
  .pet-eye{position:absolute;top:0;width:5px;height:5px;border-radius:50%;background:#fff}
  .pet-eye.left{left:0}.pet-eye.right{right:0}
  .pet-mouth{position:absolute;left:8px;top:7px;width:8px;height:2px;background:rgba(0,0,0,.52)}
  .pet-ear{position:absolute;top:0;width:17px;height:20px;background:var(--pet-dark);border:2px solid rgba(0,0,0,.32)}
  .pet-ear.left{left:8px;border-radius:14px 4px 12px 6px;transform:rotate(-14deg)}
  .pet-ear.right{right:8px;border-radius:4px 14px 6px 12px;transform:rotate(14deg)}
  .pet-arm{position:absolute;top:36px;width:12px;height:24px;border-radius:10px;background:var(--pet-dark)}
  .pet-arm.left{left:2px;transform-origin:top center}.pet-arm.right{right:2px;transform-origin:top center}
  .pet-foot{position:absolute;bottom:2px;width:20px;height:8px;border-radius:12px;background:var(--pet-dark)}
  .pet-foot.left{left:12px}.pet-foot.right{right:12px}
  .pet-image{position:absolute;inset:0;width:96px;height:96px;object-fit:contain;display:none;pointer-events:none}
  .pet.has-image .pet-core{display:none}.pet.has-image .pet-image{display:block}
  .pet.palette-graphite{--pet:#555a62;--pet-dark:#262a30}
  .pet.palette-green{--pet:#208553;--pet-dark:#0f5534}
  .pet.palette-blue{--pet:#2f67d8;--pet-dark:#173778}
  .pet.palette-violet{--pet:#7651c7;--pet-dark:#452284}
  .pet.palette-red{--pet:#d84a39;--pet-dark:#84281f}
  .pet.palette-amber{--pet:#c57a1b;--pet-dark:#77450e}
  .pet.palette-teal{--pet:#0e7d85;--pet-dark:#06484e}
  .pet.palette-mono{--pet:#f6f3ea;--pet-dark:#17191d}
  .pet.mode-walk .pet-foot.left{animation:stepA .32s infinite}.pet.mode-walk .pet-foot.right{animation:stepB .32s infinite}
  .pet.mode-climb .pet-core{animation:climb .46s infinite}
  .pet.mode-wave .pet-arm.right{animation:wave .62s ease-in-out infinite}
  .pet.mode-float .pet-core{animation:floaty 1.4s ease-in-out infinite}
  .pet.mode-tap .pet-core{animation:tap .38s ease-in-out infinite}
  @keyframes stepA{50%{transform:translateX(6px)}}@keyframes stepB{50%{transform:translateX(-6px)}}
  @keyframes climb{50%{transform:translateY(-5px) rotate(-2deg)}}@keyframes wave{50%{transform:rotate(-48deg)}}
  @keyframes floaty{50%{transform:translateY(-8px)}}@keyframes tap{50%{transform:translateY(4px) scaleY(.96)}}

  .console{border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px}
  .talk-btn{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:background .15s,color .15s}
  .talk-btn.listening{background:var(--signal);border-color:var(--signal);color:#fff;animation:talkpulse 1.2s ease-in-out infinite}
  .talk-btn.thinking{background:var(--violet);border-color:var(--violet);color:#fff}
  .talk-btn.speaking{background:var(--green);border-color:var(--green);color:#fff}
  .talk-btn:disabled{opacity:.5;cursor:default}
  @keyframes talkpulse{50%{box-shadow:0 0 0 12px rgba(229,72,43,.14)}}
  .console-text{min-width:0}
  .console-text strong{display:block;font-size:17px;font-weight:500;line-height:1.15}
  .console-text span{display:block;margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .share-line{display:none;margin-top:8px}
  .share-line.visible{display:block}
  .share-line input{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
    padding:7px 8px;font-family:var(--mono);font-size:12px;line-height:1.3}
  .behavior{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .chip{height:28px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .chip.active{color:#fff;background:var(--ink);border-color:var(--ink)}

  .form{padding:16px;display:grid;gap:16px}
  .field{display:grid;gap:7px}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .field textarea{min-height:104px;resize:vertical}
  .swatches,.segments{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:30px;height:30px;border-radius:6px;border:1px solid rgba(0,0,0,.22);background:var(--swatch);position:relative}
  .swatch.active:after{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  .seg{height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;font-family:var(--mono);font-size:12px;padding:0 11px;color:var(--muted)}
  .seg.active{color:#fff;background:var(--ink);border-color:var(--ink)}
  .voice-status{min-height:30px;border:1px solid var(--line);border-radius:7px;background:#fbfaf7;
    padding:7px 9px;font-family:var(--mono);font-size:11px;line-height:1.35;color:var(--muted)}
  .voice-status.ready{border-color:rgba(32,133,83,.36);background:#f3fbf6;color:var(--green)}
  .voice-status.waiting{border-color:rgba(197,122,27,.36);background:#fff8ed;color:var(--amber)}
  .voice-status.error{border-color:rgba(229,72,43,.36);background:#fff6f2;color:var(--signal)}
  .file{position:relative;display:flex;align-items:center;gap:10px}
  .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .file .cmd{display:inline-flex;align-items:center}
  .file span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .range-row{display:grid;grid-template-columns:1fr 42px;gap:10px;align-items:center}
  .range-row input{width:100%;accent-color:var(--signal)}
  .range-row output{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
  .rule-list{display:grid;gap:8px}
  .rule-row{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 34px;gap:6px;align-items:center}
  .rule-row input[type="text"]{min-width:0;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
    padding:8px 9px;font-family:var(--mono);font-size:12px;line-height:1.25}
  .rule-enabled{height:34px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);
    border-radius:6px;background:#fff;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .rule-enabled input{width:13px;height:13px;margin:0;accent-color:var(--signal)}
  .rule-remove{width:34px;padding:0}
  .stack{display:grid;gap:9px}
  .hint{min-height:18px;font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.45}
  .hint.err{color:#a43a2a}.hint.ok{color:#26724d}

  @media (max-width:980px){
    .workspace{grid-template-columns:1fr}
    .rail,.inspector{min-height:auto;border:0;border-bottom:1px solid var(--line)}
    .stage-wrap{min-height:560px}
    .catalog{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:620px){
    .topbar{padding:0 14px}.workspace{display:block}.stage-head{align-items:flex-start;height:auto;padding:12px 14px;flex-direction:column}
    .stage-actions{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}
    .stage-actions .cmd{width:100%}.console{grid-template-columns:1fr}.behavior{justify-content:flex-start}.catalog{grid-template-columns:1fr}
    .rule-row{grid-template-columns:48px minmax(0,1fr) 34px}
    .rule-row .rule-action{grid-column:2/4}
  }
  @media (prefers-reduced-motion:reduce){
    .pet *{animation:none!important}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><img src="../assets/moa-mark.png" alt="" /> A.G. Pet Studio</div>
    <a href="../">Home</a>
  </header>

  <main class="workspace">
    <aside class="rail">
      <div class="pane-head">
        <h1>Catalog</h1>
        <span class="status" id="catalogStatus">Loading</span>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search pets" autocomplete="off" />
      </div>
      <div class="catalog" id="catalog"></div>
    </aside>

    <section class="stage-wrap">
      <div class="stage-head">
        <div class="selected-title">
          <strong id="selectedName">Shigmi Steward</strong>
          <span id="selectedMeta">shimeji-web / walk</span>
        </div>
        <div class="stage-actions">
          <button class="cmd" id="previewBtn" type="button">Preview</button>
          <button class="cmd" id="shareBtn" type="button">Share</button>
          <button class="cmd primary" id="applyBtn" type="button">Apply</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <div class="edge top"></div><div class="edge left"></div><div class="edge right"></div><div class="floor"></div>
        <div class="pet palette-blue mode-walk" id="pet" aria-label="Animated pet preview. Hold to talk, drag to move." role="img" title="Hold to talk, drag to move">
          <div class="pet-shadow"></div>
          <img class="pet-image" id="petImage" alt="" />
          <div class="pet-core">
            <div class="pet-ear left"></div><div class="pet-ear right"></div>
            <div class="pet-arm left"></div><div class="pet-arm right"></div>
            <div class="pet-body"></div>
            <div class="pet-face"><i class="pet-eye left"></i><i class="pet-eye right"></i><i class="pet-mouth"></i></div>
            <div class="pet-foot left"></div><div class="pet-foot right"></div>
          </div>
        </div>
      </div>
      <div class="console">
        <button class="talk-btn" id="talkBtn" type="button" aria-label="Talk to this pet">Talk</button>
        <div class="console-text">
          <strong id="consoleTitle">Ready</strong>
          <span id="consoleLine">Hold the pet or press Talk to speak with it</span>
          <div class="share-line" id="shareLine">
            <input id="shareUrl" type="text" readonly aria-label="Share URL" />
          </div>
        </div>
        <div class="behavior" id="behaviorBar"></div>
      </div>
    </section>

    <aside class="inspector">
      <div class="pane-head">
        <h2>Create</h2>
        <span class="status" id="apiStatus">Gateway</span>
      </div>
      <form class="form" id="petForm">
        <div class="field">
          <label for="petName">Name</label>
          <input id="petName" type="text" maxlength="80" value="Shigmi Scout" />
        </div>
        <div class="field">
          <label for="petPrompt">Prompt</label>
          <textarea id="petPrompt">A research scout that peeks around the edge of the page and helps compare options.</textarea>
        </div>
        <div class="field">
          <label>Palette</label>
          <div class="swatches" id="paletteControls"></div>
        </div>
        <div class="field">
          <label>Motion</label>
          <div class="segments" id="motionControls"></div>
        </div>
        <div class="field">
          <label>Voice</label>
          <div class="segments" id="voiceControls"></div>
          <div class="voice-status waiting" id="voiceStatus"></div>
        </div>
        <div class="field">
          <label for="scaleInput">Scale</label>
          <div class="range-row">
            <input id="scaleInput" type="range" min="0.7" max="1.5" step="0.05" value="1" />
            <output id="scaleOutput">1.00</output>
          </div>
        </div>
        <div class="field">
          <label>Image</label>
          <div class="file">
            <button class="cmd" type="button">Upload</button>
            <span id="fileName">No image</span>
            <input id="imageInput" type="file" accept="image/png,image/webp,image/jpeg" />
          </div>
        </div>
        <div class="field">
          <label>Rules</label>
          <div class="rule-list" id="ruleList"></div>
          <button class="cmd" id="addRuleBtn" type="button">Add rule</button>
        </div>
        <div class="stack">
          <button class="cmd primary" id="draftBtn" type="submit">Create agent</button>
          <button class="cmd" id="generateBtn" type="button">Generate image</button>
        </div>
        <div class="hint" id="formHint" role="status" aria-live="polite"></div>
      </form>
    </aside>
  </main>
</div>

<script>
(function(){
  var palettes={
    graphite:"#555a62",green:"#208553",blue:"#2f67d8",violet:"#7651c7",
    red:"#d84a39",amber:"#c57a1b",teal:"#0e7d85",mono:"#f6f3ea"
  };
  var motions=["walk","peek","climb","tap","trail","float","spark"];
  // The gateway's canonical Gemini TTS voices (profile-options.js VOICE_OPTIONS);
  // the id is sent as the per-session `voice` override on session_start.
  var voices=[
    {id:"Puck",hint:"Bright, quick, and upbeat"},
    {id:"Charon",hint:"Lower, steady, and direct"},
    {id:"Kore",hint:"Clear, measured, and composed"},
    {id:"Fenrir",hint:"Firm, low, and grounded"},
    {id:"Aoede",hint:"Warm, smooth, and expressive"},
    {id:"Leda",hint:"Light, calm, and soft"},
    {id:"Orus",hint:"Clear, formal, and controlled"},
    {id:"Zephyr",hint:"Airy, gentle, and relaxed"}
  ];
  var localAgentsKey="moa.petStudio.agents.v1";
  var deviceIdKey="moa.petStudio.deviceId.v1";
  var fallbackPets=[
    petRecord("shigmi-steward","Shigmi Steward","Default operator","graphite","hover","steward"),
    petRecord("shigmi-scout","Shigmi Scout","Research and discovery","green","peek","scout"),
    petRecord("shigmi-builder","Shigmi Builder","Implementation companion","blue","tap","builder"),
    petRecord("shigmi-scribe","Shigmi Scribe","Writing companion","violet","trail","scribe")
  ];
  var state={
    pets:[],selected:null,query:"",palette:"green",motion:"peek",scale:1,voice:"Kore",
    imageDataUrl:"",rules:[],x:120,y:120,vx:42,vy:0,dir:1,mode:"walk",drag:false,last:0,nextModeAt:0,
    pointerStart:null,holdTimer:null,holdTalk:false
  };

  // Voice turn state: idle -> listening (mic streaming) -> thinking (committed,
  // waiting on the gateway) -> speaking (reply audio playing) -> idle.
  var voice={
    state:"idle",ws:null,ctx:null,mediaStream:null,sourceNode:null,processor:null,
    turnId:"",playHead:0,audioDone:false,gotReplyAudio:false,turnDone:false,
    pending:[],commitQueued:false,finishTimer:null,replyText:"",playbackRate:1
  };

  var els={
    catalog:document.getElementById("catalog"),
    catalogStatus:document.getElementById("catalogStatus"),
    apiStatus:document.getElementById("apiStatus"),
    search:document.getElementById("searchInput"),
    selectedName:document.getElementById("selectedName"),
    selectedMeta:document.getElementById("selectedMeta"),
    consoleTitle:document.getElementById("consoleTitle"),
    consoleLine:document.getElementById("consoleLine"),
    shareLine:document.getElementById("shareLine"),
    shareUrl:document.getElementById("shareUrl"),
    behaviorBar:document.getElementById("behaviorBar"),
    stage:document.getElementById("stage"),
    pet:document.getElementById("pet"),
    petImage:document.getElementById("petImage"),
    petName:document.getElementById("petName"),
    petPrompt:document.getElementById("petPrompt"),
    paletteControls:document.getElementById("paletteControls"),
    motionControls:document.getElementById("motionControls"),
    voiceControls:document.getElementById("voiceControls"),
    voiceStatus:document.getElementById("voiceStatus"),
    talkBtn:document.getElementById("talkBtn"),
    scaleInput:document.getElementById("scaleInput"),
    scaleOutput:document.getElementById("scaleOutput"),
    imageInput:document.getElementById("imageInput"),
    fileName:document.getElementById("fileName"),
    ruleList:document.getElementById("ruleList"),
    addRuleBtn:document.getElementById("addRuleBtn"),
    form:document.getElementById("petForm"),
    hint:document.getElementById("formHint"),
    previewBtn:document.getElementById("previewBtn"),
    shareBtn:document.getElementById("shareBtn"),
    applyBtn:document.getElementById("applyBtn"),
    generateBtn:document.getElementById("generateBtn")
  };

  initControls();
  bindEvents();
  loadPets();
  requestAnimationFrame(tick);

  function petRecord(id,name,summary,palette,motion,skin){
    return {
      id:id,companion_id:id,companion_name:name,companion_summary:summary,source:"builtin",
      tags:["shigmi"],voice:"Kore",
      pet:{
        renderer:"shimeji-web",family:"shigmi",skin:skin,palette:palette,motion:motion,scale:1,
        sprite:{type:"css-shigmi",frame_width:96,frame_height:96,frame_count:1},
        behaviors:[
          {id:"idle",label:"Idle"},{id:"walk",label:"Walk"},{id:"climb",label:"Climb"},
          {id:"drag",label:"Drag"},{id:"fall",label:"Fall"}
        ]
      },
      rules:[],
      starters:[]
    };
  }

  function initControls(){
    Object.keys(palettes).forEach(function(key){
      var button=document.createElement("button");
      button.type="button";button.className="swatch";button.style.setProperty("--swatch",palettes[key]);
      button.setAttribute("aria-label",key);button.dataset.palette=key;
      els.paletteControls.appendChild(button);
    });
    motions.forEach(function(key){
      var button=document.createElement("button");
      button.type="button";button.className="seg";button.textContent=key;button.dataset.motion=key;
      els.motionControls.appendChild(button);
    });
    voices.forEach(function(item){
      var button=document.createElement("button");
      button.type="button";button.className="seg";button.textContent=item.id;button.title=item.hint;button.dataset.voice=item.id;
      els.voiceControls.appendChild(button);
    });
    refreshControlState();
  }

  function bindEvents(){
    els.search.addEventListener("input",function(){state.query=els.search.value.trim().toLowerCase();renderCatalog();});
    els.paletteControls.addEventListener("click",function(event){
      var button=event.target.closest("[data-palette]");if(!button)return;
      state.palette=button.dataset.palette;applyControlsToPreview();refreshControlState();
    });
    els.motionControls.addEventListener("click",function(event){
      var button=event.target.closest("[data-motion]");if(!button)return;
      state.motion=button.dataset.motion;state.mode=motionMode(state.motion);applyControlsToPreview();refreshControlState();
    });
    els.voiceControls.addEventListener("click",function(event){
      var button=event.target.closest("[data-voice]");if(!button)return;
      state.voice=button.dataset.voice;applyControlsToPreview();refreshControlState();
      setConsole("Voice: "+state.voice,(voices.filter(function(v){return v.id===state.voice;})[0]||{}).hint||"");
    });
    els.talkBtn.addEventListener("click",toggleTalk);
    window.addEventListener("keydown",function(event){
      if(event.key==="Escape"&&voice.state!=="idle")cancelVoiceTurn();
    });
    els.scaleInput.addEventListener("input",function(){
      state.scale=Number(els.scaleInput.value)||1;applyPetVisual();refreshControlState();
    });
    els.imageInput.addEventListener("change",handleImageUpload);
    els.ruleList.addEventListener("input",updateRulesFromDom);
    els.ruleList.addEventListener("change",updateRulesFromDom);
    els.ruleList.addEventListener("click",removeRule);
    els.addRuleBtn.addEventListener("click",addRule);
    els.form.addEventListener("submit",createPet);
    els.previewBtn.addEventListener("click",previewSelected);
    els.shareBtn.addEventListener("click",bookmarkSelected);
    els.applyBtn.addEventListener("click",applySelected);
    els.generateBtn.addEventListener("click",generateImage);
    els.pet.addEventListener("pointerdown",startDrag);
    window.addEventListener("pointermove",dragMove);
    window.addEventListener("pointerup",endDrag);
  }

  async function loadPets(){
    var requestedAgent=new URLSearchParams(window.location.search).get("agent");
    try{
      var res=await fetch("/api/pets",{headers:{"accept":"application/json"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      var data=await res.json();
      state.pets=mergePets((data.pets||[]).map(normalizePet),getLocalAgents());
      els.catalogStatus.textContent=String(state.pets.length);
      els.apiStatus.textContent=data.generation&&data.generation.configured?"Vertex":"Gateway";
    }catch(err){
      state.pets=mergePets(fallbackPets,getLocalAgents());
      els.catalogStatus.textContent="Local";
      els.apiStatus.textContent="Local";
    }
    if(requestedAgent){
      var loaded=await loadAgent(requestedAgent);
      if(loaded){selectPet(loaded);}
      else{selectPet(findPet(requestedAgent)||state.pets[0]);}
    }else{
      selectPet(state.pets[0]);
    }
    renderCatalog();
  }

  function normalizePet(item){
    var companion=item.companion||item;
    var pet=item.pet||companion.pet||{};
    return {
      id:item.id||item.companion_id||companion.id,
      companion_id:item.companion_id||companion.id||item.id,
      companion_name:item.companion_name||companion.name||"Custom pet",
      companion_summary:item.companion_summary||companion.summary||"",
      source:item.source||companion.source||"custom",
      tags:item.tags||companion.tags||[],
      voice:item.voice||companion.voice||"",
      voice_binding:item.voice_binding||companion.voice_binding||null,
      pet:{
        renderer:pet.renderer||"shimeji-web",
        family:pet.family||"shigmi",
        skin:pet.skin||"companion",
        palette:pet.palette||"blue",
        motion:pet.motion||"walk",
        scale:Number(pet.scale)||1,
        sprite:pet.sprite||{type:"css-shigmi"},
        behaviors:pet.behaviors||[]
      },
      rules:sanitizeRules(item.rules||companion.rules||[]),
      starters:item.starters||companion.starters||[]
    };
  }

  async function loadAgent(id){
    var existing=findPet(id);
    try{
      var res=await fetch("/api/pets/agents/"+encodeURIComponent(id),{headers:{"accept":"application/json"}});
      var data=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(data.error||"Load failed");
      var agent=normalizePet(data.agent||data.pet||data.companion||data);
      upsertPet(agent);
      return agent;
    }catch(err){
      var local=findLocalAgent(id)||existing;
      if(!local)setConsole("Load blocked", err.message||"Gateway unavailable");
      return local||null;
    }
  }

  function mergePets(primary,local){
    var seen={};
    return primary.concat(local).filter(function(item){
      if(!item||!item.id||seen[item.id])return false;
      seen[item.id]=true;
      return true;
    });
  }

  function upsertPet(item){
    state.pets=state.pets.filter(function(existing){return existing.id!==item.id;});
    state.pets.unshift(item);
    renderCatalog();
  }

  function findPet(id){
    return state.pets.filter(function(item){return item.id===id||item.companion_id===id;})[0]||null;
  }

  function getLocalAgents(){
    try{
      var parsed=JSON.parse(window.localStorage.getItem(localAgentsKey)||"[]");
      return Array.isArray(parsed)?parsed.map(normalizePet):[];
    }catch(err){
      return [];
    }
  }

  function findLocalAgent(id){
    return getLocalAgents().filter(function(item){return item.id===id||item.companion_id===id;})[0]||null;
  }

  function saveLocalAgent(item){
    try{
      var list=getLocalAgents().filter(function(existing){return existing.id!==item.id;});
      list.unshift(item);
      window.localStorage.setItem(localAgentsKey,JSON.stringify(list.slice(0,20)));
    }catch(err){}
  }

  function addRule(){
    state.rules=collectRules(true);
    state.rules.push({id:"rule-"+Date.now().toString(36),trigger:"",action:"",enabled:true,summary:""});
    renderRules();
  }

  function removeRule(event){
    var button=event.target.closest(".rule-remove");
    if(!button)return;
    var row=button.closest(".rule-row");
    state.rules=collectRules(true).filter(function(rule){return rule.id!==(row&&row.dataset.ruleId);});
    renderRules();
  }

  function updateRulesFromDom(){
    state.rules=collectRules(true);
  }

  function renderRules(){
    els.ruleList.innerHTML="";
    state.rules.forEach(function(rule){
      var row=document.createElement("div");
      row.className="rule-row";
      row.dataset.ruleId=rule.id;
      row.innerHTML='<label class="rule-enabled"><input class="rule-on" type="checkbox" /><span>On</span></label><input class="rule-trigger" type="text" maxlength="120" placeholder="Trigger" /><input class="rule-action" type="text" maxlength="180" placeholder="Action" /><button class="icon-btn rule-remove" type="button" aria-label="Remove rule">x</button>';
      row.querySelector(".rule-on").checked=rule.enabled!==false;
      row.querySelector(".rule-trigger").value=rule.trigger||"";
      row.querySelector(".rule-action").value=rule.action||"";
      els.ruleList.appendChild(row);
    });
  }

  function collectRules(keepBlank){
    return Array.prototype.map.call(els.ruleList.querySelectorAll(".rule-row"),function(row,index){
      var trigger=cleanText(row.querySelector(".rule-trigger").value,120);
      var action=cleanText(row.querySelector(".rule-action").value,180);
      return {
        id:cleanText(row.dataset.ruleId,80)||"rule-"+index,
        trigger:trigger,
        action:action,
        enabled:row.querySelector(".rule-on").checked,
        summary:cleanText(trigger+" -> "+action,220)
      };
    }).filter(function(rule){return keepBlank||rule.trigger||rule.action;}).slice(0,12);
  }

  function readRules(){
    state.rules=collectRules(false);
    return state.rules;
  }

  function sanitizeRules(rules){
    if(!Array.isArray(rules))return [];
    return rules.map(function(rule,index){
      var trigger=cleanText(rule&&rule.trigger,120);
      var action=cleanText(rule&&rule.action,180);
      return {
        id:cleanText(rule&&rule.id,80)||"rule-"+index,
        trigger:trigger,
        action:action,
        enabled:!rule||rule.enabled!==false,
        summary:cleanText(rule&&rule.summary,220)||cleanText(trigger+" -> "+action,220)
      };
    }).filter(function(rule){return rule.trigger||rule.action;}).slice(0,12);
  }

  function cleanText(value,max){
    return String(value||"").replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,max);
  }

  function agentUrl(id){
    return "/pets/?agent="+encodeURIComponent(id);
  }

  function cleanBookmarkUrl(value,id){
    try{
      var url=new URL(value,window.location.origin);
      return agentUrl(url.searchParams.get("agent")||id);
    }catch(err){
      return agentUrl(id);
    }
  }

  function showShareUrl(url){
    els.shareUrl.value=url;
    els.shareLine.classList.add("visible");
    window.history.replaceState({}, "", url);
    els.shareUrl.focus();
    els.shareUrl.select();
  }

  function renderCatalog(){
    var list=state.pets.filter(function(item){
      if(!state.query)return true;
      return [item.companion_name,item.companion_summary,item.id,(item.tags||[]).join(" ")].join(" ").toLowerCase().indexOf(state.query)>=0;
    });
    els.catalog.innerHTML="";
    list.forEach(function(item){
      var button=document.createElement("button");
      button.type="button";
      button.className="pet-row"+(state.selected&&state.selected.id===item.id?" active":"");
      button.innerHTML='<span class="mini"><span class="mini-dot"></span></span><span class="pet-copy"><strong></strong><span class="pet-meta"></span></span>';
      button.querySelector("strong").textContent=item.companion_name;
      button.querySelector(".pet-meta").textContent=(item.pet.motion||"walk")+" / "+(item.source||"custom");
      button.querySelector(".mini-dot").style.background=palettes[item.pet.palette]||palettes.blue;
      button.addEventListener("click",function(){selectPet(item);});
      els.catalog.appendChild(button);
    });
  }

  function selectPet(item){
    if(!item)return;
    if(voice.state!=="idle")cancelVoiceTurn();
    state.selected=item;
    state.palette=item.pet.palette||"blue";
    state.motion=item.pet.motion||"walk";
    state.voice=voiceBindingVoice(item);
    state.scale=Number(item.pet.scale)||1;
    state.mode=motionMode(state.motion);
    state.imageDataUrl=item.pet.sprite&&item.pet.sprite.image_data_url||"";
    state.rules=sanitizeRules(item.rules||[]);
    els.petName.value=item.companion_name||"";
    els.petPrompt.value=item.companion_summary||els.petPrompt.value;
    els.shareLine.classList.remove("visible");
    renderCatalog();
    renderRules();
    applyPetVisual();
    refreshControlState();
  }

  function applyControlsToPreview(){
    if(state.selected){
      state.selected.pet.palette=state.palette;
      state.selected.pet.motion=state.motion;
      state.selected.pet.scale=state.scale;
      state.selected.voice=state.voice;
      if(state.selected.voice_binding&&typeof state.selected.voice_binding==="object"){
        state.selected.voice_binding.provider_voice_id=state.voice;
        state.selected.voice_binding.legacy_voice=state.voice;
      }
    }
    applyPetVisual();
  }

  function canonicalVoiceId(value){
    var raw=String(value||"").trim().toLowerCase();
    var match=voices.filter(function(item){return item.id.toLowerCase()===raw;})[0];
    return match?match.id:"";
  }

  function voiceBinding(item){
    return item&&item.voice_binding&&typeof item.voice_binding==="object"?item.voice_binding:null;
  }

  function voiceBindingVoice(item){
    var binding=voiceBinding(item);
    return canonicalVoiceId(binding&&binding.provider_voice_id)||
      canonicalVoiceId(binding&&binding.legacy_voice)||
      canonicalVoiceId(item&&item.voice)||"Kore";
  }

  function customVoiceState(item){
    var binding=voiceBinding(item);
    return binding&&binding.custom_voice&&typeof binding.custom_voice==="object"?binding.custom_voice:null;
  }

  function voiceReadiness(item){
    var custom=customVoiceState(item);
    var status=String(custom&&custom.status||"not_configured").toLowerCase();
    if(status==="ready")return {kind:"ready",label:"Custom voice ready"};
    if(status==="consent_required")return {kind:"waiting",label:"Custom voice needs consent"};
    if(status==="error")return {kind:"error",label:"Custom voice unavailable"};
    if(custom&&custom.access_required===true)return {kind:"waiting",label:"Custom voice access required"};
    return {kind:"waiting",label:"Custom voice not configured"};
  }

  function renderVoiceStatus(item){
    var readiness=voiceReadiness(item);
    els.voiceStatus.className="voice-status "+readiness.kind;
    els.voiceStatus.textContent=state.voice+" · "+readiness.label;
  }

  function applyPetVisual(){
    var selected=state.selected||fallbackPets[0];
    var pet=selected.pet||{};
    var palette=state.palette||pet.palette||"blue";
    var motion=state.motion||pet.motion||"walk";
    state.scale=Number(state.scale||pet.scale||1);
    els.selectedName.textContent=selected.companion_name||"Custom pet";
    els.selectedMeta.textContent=(pet.renderer||"shimeji-web")+" / "+motion+" / "+palette+" / "+state.voice;
    els.scaleInput.value=String(state.scale);
    els.scaleOutput.textContent=state.scale.toFixed(2);
    els.pet.className="pet palette-"+palette+" mode-"+state.mode+(state.imageDataUrl?" has-image":"");
    els.petImage.src=state.imageDataUrl||"";
    renderBehaviors(pet.behaviors||[]);
    renderVoiceStatus(selected);
  }

  function renderBehaviors(behaviors){
    var list=behaviors.length?behaviors:[{id:"idle"},{id:"walk"},{id:"drag"},{id:"fall"}];
    els.behaviorBar.innerHTML="";
    list.slice(0,7).forEach(function(item){
      var button=document.createElement("button");
      button.type="button";button.className="chip"+(state.mode===item.id?" active":"");
      button.textContent=item.label||item.id;
      button.addEventListener("click",function(){state.mode=item.id;applyPetVisual();});
      els.behaviorBar.appendChild(button);
    });
  }

  function refreshControlState(){
    Array.prototype.forEach.call(els.paletteControls.children,function(button){
      button.classList.toggle("active",button.dataset.palette===state.palette);
    });
    Array.prototype.forEach.call(els.motionControls.children,function(button){
      button.classList.toggle("active",button.dataset.motion===state.motion);
    });
    Array.prototype.forEach.call(els.voiceControls.children,function(button){
      button.classList.toggle("active",button.dataset.voice===state.voice);
    });
    els.scaleOutput.textContent=(Number(els.scaleInput.value)||1).toFixed(2);
    renderVoiceStatus(state.selected);
  }

  async function createPet(event){
    event.preventDefault();
    setHint("Creating", "");
    var body=formBody();
    try{
      var res=await fetch("/api/pets/agents",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      var data=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(data.error||"Create failed");
      var pet=normalizePet(data.agent||data.pet||data.companion||data);
      upsertPet(pet);selectPet(pet);setHint("Created", "ok");
    }catch(err){
      var local=petRecord("local-"+Date.now().toString(36),body.name,body.text,body.pet.palette,body.pet.motion,"custom");
      local.source="local";
      local.voice=body.voice||local.voice;
      local.pet.scale=body.pet.scale;local.pet.sprite.image_data_url=state.imageDataUrl;local.rules=body.rules;
      saveLocalAgent(local);upsertPet(local);selectPet(local);setHint("Created locally", "ok");
    }
  }

  async function previewSelected(){
    if(!state.selected)return;
    setConsole("Previewing", state.selected.companion_name);
    try{
      var res=await fetch("/api/pets/preview",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({agent_id:state.selected.id,companion_id:state.selected.companion_id,pet:state.selected.pet,rules:readRules()})});
      var data=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(data.error||"Preview failed");
      setConsole("Preview", data.sample_text||state.selected.companion_name);
    }catch(err){
      setConsole("Preview", state.selected.companion_summary||state.selected.companion_name);
    }
  }

  async function bookmarkSelected(){
    if(!state.selected)return;
    var fallbackUrl=agentUrl(state.selected.id);
    setConsole("Sharing", state.selected.companion_name);
    try{
      var res=await fetch("/api/pets/bookmarks",{
        method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({
          agent_id:state.selected.id,
          companion_id:state.selected.companion_id,
          pet:state.selected.pet,
          rules:readRules(),
          companion:{id:state.selected.companion_id,name:state.selected.companion_name,summary:state.selected.companion_summary}
        })
      });
      var data=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(data.error||"Bookmark failed");
      var url=cleanBookmarkUrl(data.url||fallbackUrl,state.selected.id);
      showShareUrl(url);
      setConsole("Bookmarked", url);
    }catch(err){
      showShareUrl(fallbackUrl);
      setConsole("Bookmark blocked", err.message||"Gateway unavailable");
    }

  async function applySelected(){
    if(!state.selected)return;
    setConsole("Applying", state.selected.companion_name);
    try{
      var res=await fetch("/api/pets/apply",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({agent_id:state.selected.id,companion_id:state.selected.companion_id,scope:"global",source:"website-pet-studio",rules:readRules()})});
      var data=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(data.error||"Apply failed");
      setConsole("Applied", data.profile&&data.profile.active_companion_name||state.selected.companion_name);
    }catch(err){
      setConsole("Apply blocked", err.message||"Gateway unavailable");
    }
  }

  async function generateImage(){
    setHint("Generating", "");
    var body=formBody();
    body.image_data_url=state.imageDataUrl;
    try{
      var res=await fetch("/api/pets/generate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      var data=await res.json().catch(function(){return {};});
      if(!res.ok)throw new Error(data.error||"Generate failed");
      if(data.images&&data.images[0]&&data.images[0].data_url){
        state.imageDataUrl=data.images[0].data_url;els.fileName.textContent="Generated image";applyPetVisual();setHint("Generated", "ok");
      }else{
        setHint(data.status==="not_configured"?"Generation not configured":"Generation planned", "");
      }
    }catch(err){
      setHint(err.message||"Generate failed", "err");
    }
  }

  function formBody(){
    state.scale=Number(els.scaleInput.value)||1;
    var rules=readRules();
    return {
      name:els.petName.value.trim()||"Shigmi Companion",
      text:els.petPrompt.value.trim(),
      palette:state.palette,
      motion:state.motion,
      voice:state.voice,
      image_data_url:state.imageDataUrl,
      rules:rules,
      companion:{name:els.petName.value.trim()||"Shigmi Companion",summary:els.petPrompt.value.trim(),voice:state.voice},
      pet:{palette:state.palette,motion:state.motion,scale:state.scale,source_image:state.imageDataUrl}
    };
  }

  function handleImageUpload(){
    var file=els.imageInput.files&&els.imageInput.files[0];
    if(!file)return;
    if(file.size>520000){setHint("Image is too large", "err");return;}
    var reader=new FileReader();
    reader.onload=function(){
      state.imageDataUrl=String(reader.result||"");
      els.fileName.textContent=file.name;
      applyPetVisual();
      setHint("Image loaded", "ok");
    };
    reader.onerror=function(){setHint("Image failed", "err");};
    reader.readAsDataURL(file);
  }

  // One pointer gesture, two meanings: hold still ~260ms = talk to the pet
  // (release to send), move first = drag it around. Same split as the
  // extension launcher's voice-first gestures.
  function startDrag(event){
    state.pointerStart={x:event.clientX,y:event.clientY};
    els.pet.setPointerCapture(event.pointerId);
    if(voice.state==="idle"){
      state.holdTimer=setTimeout(function(){
        state.holdTimer=null;
        state.holdTalk=true;
        startTalk();
      },260);
    }
  }
  function dragMove(event){
    if(state.holdTalk)return;
    if(state.pointerStart&&!state.drag){
      var dx=event.clientX-state.pointerStart.x,dy=event.clientY-state.pointerStart.y;
      if(Math.sqrt(dx*dx+dy*dy)>8){
        clearHoldTimer();
        state.drag=true;els.pet.classList.add("dragging");
      }
    }
    if(!state.drag)return;moveToPointer(event);
  }
  function endDrag(){
    clearHoldTimer();
    if(state.holdTalk){
      state.holdTalk=false;state.pointerStart=null;
      if(voice.state==="listening")stopTalk();
      return;
    }
    state.pointerStart=null;
    if(!state.drag)return;
    state.drag=false;els.pet.classList.remove("dragging");state.mode=motionMode(state.motion);applyPetVisual();
  }
  function clearHoldTimer(){
    if(state.holdTimer){clearTimeout(state.holdTimer);state.holdTimer=null;}
  }

  // ---- Voice agent: mic -> /api/voice/session-ticket -> wss voice session ->
  // streamed pcm16 reply audio. The pet's selected voice rides on session_start
  // as a per-session override; replies play through Web Audio only (no local
  // speech synthesis — a text reply stays text).

  function toggleTalk(){
    if(voice.state==="idle"){startTalk();}
    else if(voice.state==="listening"){stopTalk();}
    else{cancelVoiceTurn();}
  }

  async function startTalk(){
    if(voice.state!=="idle")return;
    voice.turnId="turn_"+Math.random().toString(36).slice(2,14);
    voice.pending=[];voice.commitQueued=false;voice.replyText="";
    voice.audioDone=false;voice.gotReplyAudio=false;voice.turnDone=false;voice.playHead=0;
    voice.playbackRate=1;
    setVoiceState("listening");
    setConsole("Listening","Speak, then release the pet or press Send");
    try{
      await startCapture();
      var res=await fetch("/api/voice/session-ticket",{
        method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({session_id:voiceSessionId(),device_id:voiceDeviceId()})
      });
      var ticket=await res.json().catch(function(){return {};});
      if(!res.ok||!ticket.ws_url)throw new Error(ticket.error||"Voice ticket failed");
      if(voice.state==="idle")return;
      openVoiceSocket(ticket.ws_url);
    }catch(err){
      teardownVoice(true);
      setConsole("Voice blocked",err&&err.message||"Microphone or gateway unavailable");
    }
  }

  function openVoiceSocket(url){
    var ws=new WebSocket(url);
    ws.binaryType="arraybuffer";
    voice.ws=ws;
    ws.onopen=function(){
      if(voice.ws!==ws)return;
      if(voice.state==="idle"){try{ws.close();}catch(e){}return;}
      ws.send(JSON.stringify({
        type:"session_start",
        session_id:voiceSessionId(),
        conversation_id:voiceSessionId(),
        turn_id:voice.turnId,
        device_id:voiceDeviceId(),
        source:"website-pet-studio",
        voice:state.voice,
        persona:petPersona(),
        format:{encoding:"pcm16",sample_rate:16000,channels:1},
        client:{surface:"website-pet-studio",pet_id:state.selected&&state.selected.id||""}
      }));
      flushPendingAudio();
      if(voice.commitQueued){voice.commitQueued=false;commitVoiceTurn();}
    };
    ws.onmessage=function(event){
      if(voice.ws!==ws)return;
      if(typeof event.data==="string"){
        var payload=null;
        try{payload=JSON.parse(event.data);}catch(err){return;}
        handleVoiceEvent(payload);
      }else{
        voice.gotReplyAudio=true;
        playPcmChunk(event.data);
      }
    };
    ws.onclose=function(){
      if(voice.ws!==ws)return;
      voice.ws=null;
      if(voice.state==="listening"||voice.state==="thinking"){
        teardownVoice(false);
        setConsole("Voice disconnected","Try again");
      }
    };
  }

  function stopTalk(){
    if(voice.state!=="listening")return;
    stopCapture();
    setVoiceState("thinking");
    setConsole("Thinking","");
    if(voice.ws&&voice.ws.readyState===1){commitVoiceTurn();}
    else{voice.commitQueued=true;}
  }

  function commitVoiceTurn(){
    try{voice.ws.send(JSON.stringify({type:"commit_turn",turn_id:voice.turnId}));}catch(err){}
  }

  function cancelVoiceTurn(){
    if(voice.ws&&voice.ws.readyState===1){
      try{voice.ws.send(JSON.stringify({type:"cancel_turn",turn_id:voice.turnId}));}catch(err){}
    }
    teardownVoice(true);
    setConsole("Canceled","Hold the pet or press Talk to speak with it");
  }

  function handleVoiceEvent(event){
    if(!event||typeof event!=="object")return;
    if(event.type==="turn_progress"){
      if(voice.state==="thinking")setConsole("Thinking",event.stage==="tts"?"Finding its voice":"Reasoning");
    }else if(event.type==="transcript_partial"||event.type==="transcript_final"){
      setConsole("You",event.text||"");
    }else if(event.type==="assistant_text"){
      voice.replyText=event.text||"";
      setConsole(petDisplayName(),voice.replyText);
    }else if(event.type==="assistant_audio_start"){
      var rate=Number(event.playback_rate);
      voice.playbackRate=(isFinite(rate)&&rate>0)?rate:1;
      setVoiceState("speaking");
      if(voice.replyText)setConsole(petDisplayName(),voice.replyText);
    }else if(event.type==="assistant_audio_done"){
      voice.audioDone=true;
      scheduleVoiceFinish();
    }else if(event.type==="turn_done"){
      voice.turnDone=true;
      handleVoiceTurnDone(event);
    }else if(event.type==="error"){
      teardownVoice(true);
      setConsole("Voice error",event.message||"");
    }
  }

  function handleVoiceTurnDone(event){
    var status=String(event.status||"completed");
    if(status==="no_speech"){
      teardownVoice(true);
      setConsole("Didn't catch that","Hold the pet, speak, then release");
      return;
    }
    if(status!=="completed"){
      teardownVoice(true);
      setConsole("Voice "+status,event.reason||"");
      return;
    }
    if(!voice.gotReplyAudio){
      // Deliberate text delivery (modality text / no hosted voice for the
      // language): the reply stays on screen, nothing speaks locally.
      var line=voice.replyText;
      teardownVoice(true);
      if(line)setConsole(petDisplayName()+" (text)",line);
      return;
    }
    voice.audioDone=true;
    scheduleVoiceFinish();
  }

  function scheduleVoiceFinish(){
    if(!voice.audioDone)return;
    if(!voice.ctx){teardownVoice(true);return;}
    var remainingMs=Math.max(0,(voice.playHead-voice.ctx.currentTime)*1000)+150;
    if(voice.finishTimer)clearTimeout(voice.finishTimer);
    voice.finishTimer=setTimeout(function(){
      voice.finishTimer=null;
      var line=voice.replyText;
      teardownVoice(true);
      if(line)setConsole(petDisplayName(),line);
    },remainingMs);
  }

  async function startCapture(){
    voice.ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(voice.ctx.state==="suspended")await voice.ctx.resume();
    voice.mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    voice.sourceNode=voice.ctx.createMediaStreamSource(voice.mediaStream);
    voice.processor=voice.ctx.createScriptProcessor(4096,1,1);
    voice.processor.onaudioprocess=function(event){
      if(voice.state!=="listening")return;
      var pcm=downsamplePcm16(event.inputBuffer.getChannelData(0),voice.ctx.sampleRate,16000);
      if(!pcm)return;
      if(voice.ws&&voice.ws.readyState===1){try{voice.ws.send(pcm);}catch(err){}}
      else if(voice.pending.length<64){voice.pending.push(pcm);}
    };
    voice.sourceNode.connect(voice.processor);
    voice.processor.connect(voice.ctx.destination);
  }

  function stopCapture(){
    if(voice.processor){try{voice.processor.disconnect();}catch(err){}voice.processor.onaudioprocess=null;voice.processor=null;}
    if(voice.sourceNode){try{voice.sourceNode.disconnect();}catch(err){}voice.sourceNode=null;}
    if(voice.mediaStream){voice.mediaStream.getTracks().forEach(function(track){track.stop();});voice.mediaStream=null;}
  }

  function flushPendingAudio(){
    if(!voice.ws||voice.ws.readyState!==1)return;
    var chunks=voice.pending;
    voice.pending=[];
    chunks.forEach(function(chunk){try{voice.ws.send(chunk);}catch(err){}});
  }

  // Assistant audio is pcm16 mono @16k; schedule chunks back to back so the
  // streamed reply plays gaplessly as frames arrive.
  function playPcmChunk(arrayBuffer){
    if(!voice.ctx||!arrayBuffer)return;
    var byteLength=arrayBuffer.byteLength-(arrayBuffer.byteLength%2);
    if(byteLength<=0)return;
    var ints=new Int16Array(arrayBuffer,0,byteLength/2);
    var floats=new Float32Array(ints.length);
    for(var i=0;i<ints.length;i++)floats[i]=ints[i]/32768;
    var buffer=voice.ctx.createBuffer(1,floats.length,16000);
    buffer.getChannelData(0).set(floats);
    var source=voice.ctx.createBufferSource();
    source.buffer=buffer;
    var rate=voice.playbackRate||1;
    source.playbackRate.value=rate;
    source.connect(voice.ctx.destination);
    var at=Math.max(voice.ctx.currentTime+0.05,voice.playHead||0);
    source.start(at);
    voice.playHead=at+buffer.duration/rate;
  }

  function downsamplePcm16(floats,fromRate,toRate){
    if(!floats||!floats.length)return null;
    var ratio=fromRate/toRate;
    if(!(ratio>=1))ratio=1;
    var outLength=Math.floor(floats.length/ratio);
    if(outLength<=0)return null;
    var out=new Int16Array(outLength);
    var pos=0;
    for(var i=0;i<outLength;i++){
      var next=Math.min(floats.length,Math.floor((i+1)*ratio));
      var sum=0,count=0;
      for(var j=pos;j<next;j++){sum+=floats[j];count++;}
      var sample=count?sum/count:0;
      sample=Math.max(-1,Math.min(1,sample));
      out[i]=sample<0?sample*0x8000:sample*0x7fff;
      pos=next;
    }
    return out.buffer;
  }

  function teardownVoice(closeWs){
    stopCapture();
    if(voice.finishTimer){clearTimeout(voice.finishTimer);voice.finishTimer=null;}
    if(closeWs&&voice.ws){try{voice.ws.close();}catch(err){}}
    voice.ws=null;
    if(voice.ctx){try{voice.ctx.close();}catch(err){}voice.ctx=null;}
    voice.pending=[];voice.commitQueued=false;
    voice.playHead=0;voice.audioDone=false;voice.gotReplyAudio=false;voice.turnDone=false;
    setVoiceState("idle");
  }

  function setVoiceState(next){
    voice.state=next;
    els.talkBtn.className="talk-btn"+(next==="idle"?"":" "+next);
    els.talkBtn.textContent=next==="idle"?"Talk":next==="listening"?"Send":next==="thinking"?"...":"Stop";
    if(next==="listening"){state.mode="wave";}
    else if(next==="thinking"){state.mode="float";}
    else if(next==="speaking"){state.mode="tap";}
    else{state.mode=motionMode(state.motion);state.nextModeAt=0;}
    applyPetVisual();
  }

  function petDisplayName(){
    return state.selected&&state.selected.companion_name||"Pet";
  }

  // The pet speaks AS itself: its name and prompt ride session_start as a
  // session-scoped persona (the gateway sanitizes and caps it; nothing is
  // written to the stored profile).
  function petPersona(){
    var name=cleanText(state.selected&&state.selected.companion_name,80);
    var text=cleanText(state.selected&&state.selected.companion_summary,400);
    if(!name&&!text)return undefined;
    return {name:name,text:text};
  }

  function voiceSessionId(){
    var petId=String(state.selected&&state.selected.id||"studio").replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,80);
    return "petweb_"+petId;
  }

  function voiceDeviceId(){
    try{
      var existing=window.localStorage.getItem(deviceIdKey);
      if(existing)return existing;
      var next="petweb_"+Math.random().toString(36).slice(2,12);
      window.localStorage.setItem(deviceIdKey,next);
      return next;
    }catch(err){
      return "petweb_anon";
    }
  }
  function moveToPointer(event){
    var rect=els.stage.getBoundingClientRect();
    state.x=event.clientX-rect.left-48;state.y=event.clientY-rect.top-48;
    clampPosition();positionPet();
  }

  function tick(time){
    var rect=els.stage.getBoundingClientRect();
    if(!state.last)state.last=time;
    var dt=Math.min((time-state.last)/1000,.04);state.last=time;
    if(!state.drag&&voice.state==="idle"&&rect.width>0&&rect.height>0){
      if(time>state.nextModeAt){
        state.mode=randomMode();
        state.nextModeAt=time+1800+Math.random()*2600;
        applyPetVisual();
      }
      var floorY=Math.max(40,rect.height-154);
      if(state.mode==="walk"){
        state.x+=state.vx*state.dir*dt;
        state.y+=(floorY-state.y)*Math.min(1,dt*8);
      }else if(state.mode==="climb"){
        state.y-=38*dt;
        if(state.y<18){state.mode="fall";applyPetVisual();}
      }else if(state.mode==="fall"){
        state.y+=220*dt;
        if(state.y>floorY){state.y=floorY;state.mode="walk";applyPetVisual();}
      }else if(state.mode==="float"||state.mode==="idle"||state.mode==="wave"){
        state.y+=(floorY-state.y)*Math.min(1,dt*2);
      }
      if(state.x<10){state.x=10;state.dir=1}
      if(state.x>rect.width-106){state.x=rect.width-106;state.dir=-1}
      clampPosition();positionPet();
    }
    requestAnimationFrame(tick);
  }

  function randomMode(){
    if(state.motion==="climb"||state.motion==="peek")return Math.random()<.38?"climb":"walk";
    if(state.motion==="float"||state.motion==="trail")return Math.random()<.5?"float":"walk";
    if(state.motion==="spark"||state.motion==="tap")return Math.random()<.42?"wave":"tap";
    return Math.random()<.22?"idle":"walk";
  }
  function motionMode(motion){
    if(motion==="float"||motion==="trail")return "float";
    if(motion==="tap"||motion==="spark")return "tap";
    if(motion==="climb"||motion==="peek")return "climb";
    return "walk";
  }
  function clampPosition(){
    var rect=els.stage.getBoundingClientRect();
    state.x=Math.max(8,Math.min(state.x,Math.max(8,rect.width-104)));
    state.y=Math.max(8,Math.min(state.y,Math.max(8,rect.height-104)));
  }
  function positionPet(){
    els.pet.style.transform="translate("+state.x+"px,"+state.y+"px) scaleX("+state.dir+") scale("+state.scale+")";
  }
  function setHint(text,kind){els.hint.textContent=text;els.hint.className="hint "+(kind||"");}
  function setConsole(title,line){els.consoleTitle.textContent=title;els.consoleLine.textContent=line||"";}
})();
</script>
</body>
