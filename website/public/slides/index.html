<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moa — a voice assistant in your browser</title>

<!--
  ============================================================================
  MOA PITCH DECK  ·  living artifact
  ----------------------------------------------------------------------------
  COPY lives in the DECK[] block at the bottom of this file. It is GENERATED
  from Nat's working notes and regenerated as the work moves. Sources of truth:
    · scratch/vision/*.md   (framework, build-ladder, resume brief, problem map)
    · __LOG__.md            (voice thinking)
    · openspec/changes/*    (the active change)
  To update the deck: regenerate DECK[] from those sources. Do NOT hand-edit
  chrome/CSS/render below — only the data. The template renders any DECK[].
  Engine: reveal.js (CDN). One file, no build step.
  ============================================================================
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper:#F4F2EA; --paper-2:#EDEAE0;
    --ink:#191B1E; --graphite:#7A7D84; --hair:#D8D4C7;
    --signal:#E5482B;
    --serif:'Fraunces', Georgia, serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --r-background-color:var(--paper);
    --r-main-font:var(--serif); --r-main-color:var(--ink);
    --r-heading-font:var(--serif); --r-heading-color:var(--ink); --r-heading-font-weight:300;
    --r-link-color:var(--signal); --r-main-font-size:30px;
  }
  html,body{background:var(--paper)}
  .reveal{font-family:var(--serif);letter-spacing:-.005em}
  .reveal-viewport::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background:radial-gradient(120% 80% at 85% -10%, rgba(255,255,255,.7), transparent 60%),
               radial-gradient(100% 70% at 0% 110%, rgba(0,0,0,.025), transparent 55%)}

  .reveal .slides{text-align:left}
  .reveal section{padding:0}
  .reveal h1{line-height:.94;letter-spacing:-.025em;margin:0;font-weight:300}
  .xl{font-size:104px} .lg{font-size:82px} .md{font-size:56px}
  .reveal em{font-style:italic;color:var(--signal);font-weight:400}
  .ital{font-style:italic;font-weight:300}

  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--graphite);margin:0 0 30px}
  .sub{font-size:25px;font-weight:300;color:var(--ink);max-width:26ch;margin-top:34px;line-height:1.45}
  .sub.wide{max-width:42ch}
  .sub .dim{color:var(--graphite)}
  .tag{font-family:var(--mono);color:var(--signal);font-size:.92em}

  /* beats — block flow + absolute marker (NEVER flex: inline <b> would split into columns) */
  .beats{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:16px;max-width:44ch}
  .beats li{position:relative;padding-left:26px;font-size:26px;font-weight:300;line-height:1.34;color:var(--ink)}
  .beats li::before{content:"";position:absolute;left:0;top:.52em;width:9px;height:9px;
    background:var(--signal);transform:rotate(45deg)}
  .beats b{font-weight:400;font-style:italic}

  .flow{display:flex;align-items:stretch;gap:18px;margin-top:40px;max-width:880px}
  .node{flex:1;border:1px solid var(--hair);background:rgba(255,255,255,.4);padding:20px}
  .node h4{font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.1em;
    text-transform:uppercase;margin:0;color:var(--ink)}
  .node small{display:block;font-family:var(--mono);font-weight:300;font-size:14px;color:var(--graphite);
    margin-top:.7em;line-height:1.8}
  .node.io h4{color:var(--signal)}
  .node.loop{flex:.55;display:grid;place-items:center;border-style:dashed}
  .node.loop span{font-size:40px;color:var(--signal);display:inline-block;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .pipe{font-family:var(--mono);font-size:19px;font-weight:300;color:var(--ink);line-height:2;margin-top:34px}
  .pipe b{color:var(--signal);font-weight:500}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
  .chip{font-family:var(--mono);font-size:14px;border:1px solid var(--hair);padding:.5em .85em;color:var(--graphite)}
  .chip.on{color:var(--signal);border-color:rgba(229,72,43,.4)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 56px;margin-top:40px;max-width:980px}
  .cell h4{font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px;margin:0;color:var(--ink)}
  .cell p{font-family:var(--mono);font-weight:300;font-size:14px;color:var(--graphite);margin:.5em 0 0;line-height:1.6}

  /* bio — photo + credentials. Reuses card/chip language. */
  .bio{display:flex;align-items:center;gap:54px;margin-top:18px;max-width:1040px}
  .bio-photo{width:264px;height:264px;border-radius:50%;object-fit:cover;flex:none;
    box-shadow:0 0 0 1px var(--hair),0 0 0 7px var(--paper),0 0 0 8px rgba(229,72,43,.45)}
  .bio-body{flex:1}
  .bio-role{font-family:var(--mono);font-size:15px;letter-spacing:.06em;color:var(--signal);margin:14px 0 0}
  .creds{display:flex;align-items:flex-end;gap:30px;margin-top:30px;flex-wrap:wrap}
  .cred{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
  .cred .mark{height:42px;display:flex;align-items:center}
  .cred .mark img{height:42px;width:auto;display:block}
  .cred .mark.box{background:var(--ink);padding:7px 11px}
  .cred .mark.box img{height:28px}
  .cred small{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}

  .brand{position:fixed;left:46px;bottom:36px;z-index:30;display:flex;align-items:center;gap:12px;
    font-family:var(--mono);font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--graphite)}
  .live{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--signal);
    box-shadow:0 0 0 0 rgba(229,72,43,.5);animation:pulse 2.4s ease-out infinite}
  .live svg{width:24px;height:24px;animation:hop 2.4s ease-in-out infinite}
  .bird-eyebrow{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:8px;color:var(--signal)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,43,.4)}70%{box-shadow:0 0 0 13px rgba(229,72,43,0)}100%{box-shadow:0 0 0 0 rgba(229,72,43,0)}}
  @keyframes hop{0%,88%,100%{transform:translateY(0) rotate(0)}92%{transform:translateY(-2px) rotate(-4deg)}96%{transform:translateY(0) rotate(0)}}
  .counter{position:fixed;right:46px;bottom:40px;z-index:30;font-family:var(--mono);font-size:13px;
    letter-spacing:.2em;color:var(--graphite)}
  .reveal .progress{color:var(--signal);height:2px}
</style>
</head>
<body>
<!-- Moa — the bird. One source of truth, reused via <use href="#moa-bird">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="moa-bird" viewBox="0 0 50 50">
    <g fill="currentColor" stroke="none">
      <polygon points="9,29 1,33 11,37"/>
      <ellipse cx="22" cy="29" rx="13" ry="10"/>
      <circle cx="33" cy="20" r="7"/>
      <polygon points="40,18 49,19.5 40,23"/>
    </g>
    <path d="M14 26 Q 24 33 31 26" fill="none" stroke="var(--paper)" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="34.5" cy="18.5" r="1.3" fill="var(--paper)"/>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="21" y1="38" x2="20" y2="46"/>
      <line x1="27" y1="38" x2="28" y2="46"/>
    </g>
  </symbol>
</svg>

<div class="reveal"><div class="slides"><!-- rendered from DECK[] --></div></div>

<div class="brand"><span class="live"><svg viewBox="0 0 50 50" aria-hidden="true"><use href="#moa-bird"/></svg></span> Moa</div>
<div class="counter" id="counter"></div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script>
/* ============================================================================
   DECK[] — THE COPY. Generated from Nat's work; regenerate this block as the
   work evolves. Each entry is one beat. Supported `type`s render via R below.
   ============================================================================ */
const bird = '<svg class="bird-eyebrow" viewBox="0 0 50 50" aria-hidden="true"><use href="#moa-bird"/></svg>';

const DECK = [
  { type:'title', eyebrow:'Moa',
    h:'Map all the work you<br>do in <em>the browser.</em>',
    sub:'Moa runs it as agents you watch and steer.' },

  { type:'morph', aPre:'We open fifty', from:'tabs.',
    bPre:'Soon we run fifty', to:'agents.',
    sub:'People already work this way. <span class="dim">The tools do not exist yet.</span>' },

  { type:'statement', size:'xl', h:'<em>Agent sprawl.</em>',
    sub:'Launch a second agent and you lose the first. <span class="dim">No map. No memory.</span>' },

  { type:'flow', size:'md', h:'What does <span class="ital">one</span> agent do?',
    inLabel:'in', inItems:'text · image<br>audio · video',
    outLabel:'out', outItems:'text · image<br>audio · video',
    caption:'It takes what you give it, does the work in a tab, and hands back the result.' },

  { type:'beats', size:'lg', h:'Every agent is one<br><em>thread of work.</em>',
    items:[
      'Moa keeps the <em>map</em>. You see every thread at once.',
      'Speak again and it updates the <em>right thread</em>. <span class="dim">No sessions to manage.</span>',
      'Change your mind and the <em>latest word wins</em>. <span class="dim">You keep your place.</span>'
    ] },

  { type:'statement', size:'lg', h:'You steer it<br>by <em>talking.</em>',
    sub:'Each agent works in its own background tab in your browser. '
      + 'It <span class="tag">pings</span> you when it needs a choice.',
    wide:true },

  { type:'proof', size:'lg', h:'It <em>already</em> runs.',
    pipe:'speak <b>&rarr;</b> build context <b>&rarr;</b> work in a tab <b>&rarr;</b> <b>ping</b>',
    chips:[ {t:'gateway · 10.147.17.10 · 200', on:true}, {t:'voice round-trip ✓'}, {t:'prompt history ✓'} ] },

  { type:'grid', eyebrow:'What you get', size:'md',
    h:'You <span class="ital">own</span> it.',
    cells:[
      { h:'Self-hosted', p:'Run it on your own machine. Your keys, your data.' },
      { h:'Yours to change', p:'Ask for a change and a new version ships. We keep it running.' },
      { h:'Every device', p:'One agent across desktop, browser, and phone.' },
      { h:'Any model', p:'Swap the model under it. Your work stays.' }
    ] },

  { type:'bio', eyebrow:'Who is building it',
    photo:'/assets/nat.png',
    name:'Natnael Kahssay',
    role:'Founder · EECS @ MIT · Y Combinator',
    sub:'EECS at MIT. Left to build <em>Code Four</em> (YC&nbsp;X25). Building Moa next.',
    creds:[
      { src:'/assets/mit-logo.svg', label:'MIT' },
      { src:'/assets/yc-logo.svg', label:'Y Combinator' },
      { src:'/assets/codefour-logo.png', label:'Code Four · YC X25', box:true },
    ] },

  { type:'morph', aPre:'We used to manage', from:'tabs.',
    bPre:'Now Moa maps the', to:'work.' },
];

/* ---- renderers (stable; do not hand-edit per-deck) ---- */
const R = {
  title: s => `<section data-auto-animate>
      <p class="eyebrow">${bird} ${s.eyebrow}</p>
      <h1 class="${s.size||'xl'}" data-id="spine">${s.h}</h1>
      ${s.sub?`<p class="sub">${s.sub}</p>`:''}</section>`,
  statement: s => `<section data-auto-animate>
      <h1 class="${s.size}" data-id="spine">${s.h}</h1>
      ${s.sub?`<p class="sub${s.wide?' wide':''}">${s.sub}</p>`:''}</section>`,
  flow: s => `<section data-auto-animate>
      <h1 class="${s.size}" data-id="spine">${s.h}</h1>
      <div class="flow">
        <div class="node io"><h4>${s.inLabel}</h4><small>${s.inItems}</small></div>
        <div class="node loop"><span>↻</span></div>
        <div class="node io"><h4>${s.outLabel}</h4><small>${s.outItems}</small></div>
      </div>
      <p class="sub wide">${s.caption}</p></section>`,
  beats: s => `<section data-auto-animate>
      <h1 class="${s.size}" data-id="spine">${s.h}</h1>
      <ul class="beats">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></section>`,
  proof: s => `<section data-auto-animate>
      <h1 class="${s.size}" data-id="spine">${s.h}</h1>
      <p class="pipe">${s.pipe}</p>
      <div class="chips">${s.chips.map(c=>`<span class="chip${c.on?' on':''}">${c.t}</span>`).join('')}</div></section>`,
  grid: s => `<section data-auto-animate>
      <p class="eyebrow">${s.eyebrow}</p>
      <h1 class="${s.size}" data-id="spine">${s.h}</h1>
      <div class="grid">${s.cells.map(c=>`<div class="cell"><h4>${c.h}</h4><p>${c.p}</p></div>`).join('')}</div></section>`,
  bio: s => `<section data-auto-animate>
      <p class="eyebrow">${bird} ${s.eyebrow}</p>
      <div class="bio">
        <img class="bio-photo" src="${s.photo}" alt="${s.name}" />
        <div class="bio-body">
          <h1 class="md" data-id="spine">${s.name}</h1>
          <p class="bio-role">${s.role}</p>
          ${s.sub?`<p class="sub wide">${s.sub}</p>`:''}
          <div class="creds">${s.creds.map(c=>`<span class="cred"><span class="mark${c.box?' box':''}"><img src="${c.src}" alt="${c.label}" /></span><small>${c.label}</small></span>`).join('')}</div>
        </div>
      </div></section>`,
  morph: s => `<section data-auto-animate>
      <h1 class="${s.size||'xl'}">${s.aPre} <span data-id="thing" class="ital">${s.from}</span></h1></section>
    <section data-auto-animate>
      <h1 class="${s.size||'xl'}">${s.bPre} <span data-id="thing"><em>${s.to}</em></span></h1>
      ${s.sub?`<p class="sub">${s.sub}</p>`:''}</section>`,
};

document.querySelector('.slides').innerHTML = DECK.map(s => R[s.type](s)).join('\n');

Reveal.initialize({
  width:1280, height:720, margin:0.07,
  center:true, transition:'fade', transitionSpeed:'slow',
  controls:false, hash:true, progress:true,
  autoAnimateEasing:'cubic-bezier(.16,.84,.34,1)', autoAnimateDuration:0.7,
});

const counter=document.getElementById('counter');
function setCounter(){
  const idx=Reveal.getIndices().h, total=Reveal.getHorizontalSlides().length;
  counter.textContent=String(idx+1).padStart(2,'0')+' — '+String(total).padStart(2,'0');
}
Reveal.on('ready',setCounter); Reveal.on('slidechanged',setCounter);
</script>
</body>
</html>
