name: Deploy VPS gateway

# Automatic promotion of the DigitalOcean gateway (api.agee.app), pull-based.
#
# GitHub runners cannot reach port 22 on the droplet (cloud firewall), so CI
# never SSHes in. Instead: this workflow verifies the gateway, then
# fast-forwards the `vps-deploy` ref to the verified SHA. A systemd timer on
# the droplet (scripts/vps/auto-update.sh) polls origin/vps-deploy every two
# minutes and promotes through scripts/vps/update.sh, whose backup +
# restore-check data gate aborts before touching the active service if
# either fails. Broken commits never move vps-deploy, so they never deploy.

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-vps.yml"
      - "gateway/**"
      - "docker-compose.yml"
      - "docker-compose.vps.yml"
      - "scripts/vps/**"
  workflow_dispatch: {}

concurrency:
  group: chief-moa-vps-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Verify gateway and mark deployable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify gateway
        shell: bash
        run: |
          set -euo pipefail
          cd gateway
          npm install --no-audit --no-fund
          npm run check

      - name: Publish vps-deploy ref
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/vps-deploy" --force
          echo "vps-deploy -> $(git rev-parse HEAD)"
          echo "The droplet timer promotes this SHA within ~2 minutes."
