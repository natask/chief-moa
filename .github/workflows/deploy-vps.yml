name: Deploy VPS gateway

# Candidate verification for the DigitalOcean gateway. This workflow does not
# confer apply authority: runtime promotion requires an M4 evidence manifest.
#
# GitHub runners cannot reach the isolated runtime preview or the droplet, so
# CI stops at candidate verification. An operator/control-plane worker may
# advance a candidate only after producing the exact-commit M4 evidence
# manifest consumed by scripts/vps/update.sh.

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-vps.yml"
      - "gateway/**"
      - "docker-compose.yml"
      - "docker-compose.vps.yml"
      - "scripts/vps/**"
  # PRs run the SAME verification so scripts/release/push-master.sh can prove a
  # branch green before master ever moves; only the ref publish is push-gated.
  pull_request:
    paths:
      - ".github/workflows/deploy-vps.yml"
      - "gateway/**"
      - "docker-compose.yml"
      - "docker-compose.vps.yml"
      - "scripts/vps/**"
  workflow_dispatch: {}

concurrency:
  group: chief-moa-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify gateway and mark deployable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify gateway
        shell: bash
        run: |
          set -euo pipefail
          cd gateway
          # Same installer and lockfile as dev and the Docker image: what gets
          # verified is what ships.
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Publish vps-deploy ref
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          printf '%s\n' "$(git rev-parse HEAD)" > candidate-evidence/commit-sha.txt
          printf '%s\n' "Verification is not preview/apply authority." > candidate-evidence/README.txt
