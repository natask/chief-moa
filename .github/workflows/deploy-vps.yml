name: Deploy VPS gateway

# Candidate verification and publication for the DigitalOcean gateway.
#
# Pull requests are verify-only. A successful master push atomically advances
# `vps-deploy` to the exact verified commit. The droplet still requires the M4
# evidence manifest consumed by scripts/vps/update.sh before active mutation.

on:
  push:
    branches:
      - master
    paths:
      - ".github/scripts/assert-deploy-vps-contract.rb"
      - ".github/workflows/deploy-vps.yml"
      - "gateway/**"
      - "docker-compose.yml"
      - "docker-compose.vps.yml"
      - "scripts/vps/**"
  # PRs run the SAME verification so scripts/release/push-master.sh can prove a
  # branch green before master ever moves; only the ref publish is push-gated.
  pull_request:
    paths:
      - ".github/scripts/assert-deploy-vps-contract.rb"
      - ".github/workflows/deploy-vps.yml"
      - "gateway/**"
      - "docker-compose.yml"
      - "docker-compose.vps.yml"
      - "scripts/vps/**"
  workflow_dispatch: {}

concurrency:
  group: chief-moa-vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Assert deployment workflow contract
        shell: bash
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_COUNT: "0"
          NODE_OPTIONS: ""
          NODE_PATH: ""
          RUBYOPT: ""
          RUBYLIB: ""
        run: ruby .github/scripts/assert-deploy-vps-contract.rb

      - name: Verify gateway
        shell: bash
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_COUNT: "0"
          NODE_OPTIONS: ""
          NODE_PATH: ""
          RUBYOPT: ""
          RUBYLIB: ""
        run: |
          set -euo pipefail
          bash -n scripts/vps/*.sh
          bash scripts/vps/test-node-runtime.sh
          bash scripts/vps/test-preview-tls-proxy.sh
          bash scripts/vps/test-install-promotion-control-plane.sh
          bash scripts/vps/test-update-rollback.sh
          cd gateway
          # Same installer and lockfile as dev and the Docker image: what gets
          # verified is what ships.
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm run check

  publish:
    name: Publish verified gateway ref
    needs: deploy
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out verified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          # The publisher must prove vps-deploy is an ancestor. A depth-1
          # checkout is rejected by GitHub as "fetch first" even when the
          # server-side ref is actually fast-forwardable.
          fetch-depth: 0

      - name: Publish vps-deploy ref
        shell: bash
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_COUNT: "0"
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse refs/remotes/origin/master)" = "$GITHUB_SHA"
          git push --atomic origin "${GITHUB_SHA}:refs/heads/vps-deploy"

  observe:
    name: Verify live gateway commit
    needs: publish
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Wait for exact commit at active gateway
        shell: bash
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_COUNT: "0"
          NODE_OPTIONS: ""
          NODE_PATH: ""
          RUBYOPT: ""
          RUBYLIB: ""
          EXPECTED_GIT_SHA: ${{ github.sha }}
          HEALTH_URL: https://api.agee.app/health
        run: |
          set -euo pipefail
          deadline="$(( $(date +%s) + 1200 ))"
          live_sha="unavailable"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            health="$(curl -fsS --connect-timeout 5 --max-time 10 \
              -H 'Cache-Control: no-cache' "$HEALTH_URL" || true)"
            observed="$(ruby -rjson -e '
              health = JSON.parse(STDIN.read)
              sha = health.dig("build", "git_sha")
              abort unless sha.is_a?(String) && sha.match?(/\A[0-9a-f]{7,64}\z/i)
              print sha.downcase
            ' <<<"$health" 2>/dev/null || true)"
            if [ -n "$observed" ]; then
              live_sha="$observed"
            fi
            if [ "$live_sha" = "$EXPECTED_GIT_SHA" ]; then
              echo "active gateway serves exact commit $EXPECTED_GIT_SHA"
              exit 0
            fi
            echo "waiting for active gateway: expected=$EXPECTED_GIT_SHA observed=$live_sha"
            sleep 15
          done
          echo "active gateway stayed stale: expected=$EXPECTED_GIT_SHA observed=$live_sha" >&2
          exit 1
