name: Verify Windows surface core

on:
  pull_request:
    paths: ["windows_app/**", ".github/workflows/windows-native-core.yml"]
  push:
    paths: ["windows_app/**", ".github/workflows/windows-native-core.yml"]

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows_app/core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable resolved 2026-07-11
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --locked --target x86_64-pc-windows-msvc
