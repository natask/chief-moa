name: Release browser extension

on:
  pull_request:
    paths:
      - ".github/workflows/browser-extension-release.yml"
      - "browser_extension/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/browser-extension-release.yml"
      - "browser_extension/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload and submit the verified package to Chrome Web Store
        required: false
        default: false
        type: boolean

concurrency:
  group: browser-extension-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify, smoke, package, and optionally publish
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Require a manifest version bump for packaged source changes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No comparable base commit; version-bump check skipped."
            exit 0
          fi
          if ! git diff --quiet "$BASE_SHA" HEAD -- browser_extension/extension; then
            current_version="$(node -p "require('./browser_extension/extension/manifest.json').version")"
            previous_version="$(git show "$BASE_SHA:browser_extension/extension/manifest.json" | node -e "let s=''; process.stdin.on('data', c => s += c); process.stdin.on('end', () => console.log(JSON.parse(s).version))")"
            if [[ "$current_version" == "$previous_version" ]]; then
              echo "Extension package sources changed without a manifest version bump ($current_version)." >&2
              exit 1
            fi
          fi

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via
      # AppArmor, which kills Chrome's sandbox ("No usable sandbox!").
      - name: Allow Chrome's unprivileged user namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pinned Chrome for Testing
        shell: bash
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        # The CLI installs into --path (default: cwd), not PUPPETEER_CACHE_DIR,
        # so point it at the cache root the smoke harness searches.
        run: npx --yes @puppeteer/browsers@2.10.10 install chrome@stable --path "$PUPPETEER_CACHE_DIR"

      - name: Verify extension
        working-directory: browser_extension
        run: npm run verify

      - name: Smoke extension
        working-directory: browser_extension
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: npm run smoke

      - name: Package extension
        id: package
        working-directory: browser_extension
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          version="$(node -p "require('./extension/manifest.json').version")"
          package_path="$(find dist -maxdepth 1 -type f -name "*-${version}.zip" -print -quit)"
          if [[ -z "$package_path" ]]; then
            echo "Packaged archive for version $version was not found." >&2
            exit 1
          fi
          digest="$(sha256sum "$package_path" | awk '{print $1}')"
          size="$(stat -c '%s' "$package_path")"
          printf '%s  %s\n' "$digest" "$(basename "$package_path")" > "${package_path}.sha256"
          {
            echo "version=$version"
            echo "package_path=browser_extension/$package_path"
            echo "checksum_path=browser_extension/${package_path}.sha256"
            echo "package_sha256=$digest"
            echo "package_size=$size"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Browser extension artifact"
            echo "- Version: \`$version\`"
            echo "- SHA-256: \`$digest\`"
            echo "- Size: $size bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check publication gate
        id: publish_gate
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          PACKAGE_SIZE: ${{ steps.package.outputs.package_size }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          publish_ready=false
          reason="artifact-only run"
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            missing=()
            [[ -n "$CWS_PUBLISHER_ID" ]] || missing+=(CWS_PUBLISHER_ID)
            [[ -n "$CWS_EXTENSION_ID" ]] || missing+=(CWS_EXTENSION_ID)
            [[ -n "$CWS_SERVICE_ACCOUNT_JSON" ]] || missing+=(CWS_SERVICE_ACCOUNT_JSON)
            if (( ${#missing[@]} == 0 )); then
              publish_ready=true
              reason="explicit publication requested and credentials are configured"
            else
              reason="publication blocked; missing ${missing[*]}"
            fi
          fi
          echo "publish_ready=$publish_ready" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Publication gate: $reason" >> "$GITHUB_STEP_SUMMARY"
          export PUBLICATION_READY="$publish_ready"
          export PUBLICATION_REASON="$reason"
          mkdir -p browser_extension/dist
          node <<'NODE'
          const fs = require("node:fs");
          const evidence = {
            schema_version: "chrome-web-store-release-evidence/v1",
            expected_version: process.env.PACKAGE_VERSION,
            git_sha: process.env.GITHUB_SHA || null,
            package: {
              sha256: process.env.PACKAGE_SHA256,
              size_bytes: Number(process.env.PACKAGE_SIZE),
            },
            publication_requested: process.env.PUBLISH_REQUESTED === "true",
            publication_ready: process.env.PUBLICATION_READY === "true",
            status: process.env.PUBLICATION_READY === "true" ? "pending" : "artifact_only",
            blocker: process.env.PUBLICATION_REASON,
          };
          fs.writeFileSync(
            "browser_extension/dist/chrome-web-store-status.json",
            `${JSON.stringify(evidence, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE

      - name: Authenticate to Google Cloud
        id: google_auth
        if: steps.publish_gate.outputs.publish_ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit to Chrome Web Store
        if: steps.publish_gate.outputs.publish_ready == 'true'
        working-directory: browser_extension
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: >-
          node scripts/publish-chrome-web-store.mjs
          --package "../${{ steps.package.outputs.package_path }}"
          --version "${{ steps.package.outputs.version }}"
          --evidence dist/chrome-web-store-status.json

      - name: Upload release artifact and evidence
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agee-chrome-${{ steps.package.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.checksum_path }}
            browser_extension/dist/chrome-web-store-status.json
