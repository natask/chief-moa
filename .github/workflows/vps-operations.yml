name: Audit VPS deployment worker

# Manual, read-only observability for the pull worker on the DigitalOcean VPS.
# This workflow does not fetch into the remote checkout, invoke update scripts,
# restart systemd/Docker, publish refs, or promote a candidate.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chief-moa-vps-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only deployment audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Check out audit script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate configured SSH target
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*@[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "VPS_HOST is missing or is not a plain user@host target." >&2
            exit 1
          fi
          if [[ -z "$VPS_SSH_KEY" ]]; then
            echo "VPS_SSH_KEY is missing." >&2
            exit 1
          fi

      - name: Prepare isolated SSH client
        id: prepare_ssh
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d "$RUNNER_TEMP/vps-audit-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-audit-ssh/id"
          host="${VPS_HOST#*@}"
          if ! ssh-keyscan -T 10 -H "$host" > "$RUNNER_TEMP/vps-audit-ssh/known_hosts" 2>/dev/null; then
            {
              echo "audit_schema=chief-moa-vps-audit/v1"
              echo "audit_mode=read_only"
              echo "ssh_reachability=unreachable"
              echo "audit_status=blocked"
              echo "blocker=github_runner_cannot_reach_vps_ssh"
            } > "$RUNNER_TEMP/vps-audit.txt"
            echo "The VPS SSH port is not reachable from this GitHub-hosted runner." >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/vps-audit-ssh/id" "$RUNNER_TEMP/vps-audit-ssh/known_hosts"
          {
            echo "VPS_SSH_KEY_PATH=$RUNNER_TEMP/vps-audit-ssh/id"
            echo "VPS_KNOWN_HOSTS_PATH=$RUNNER_TEMP/vps-audit-ssh/known_hosts"
          } >> "$GITHUB_ENV"
          {
            echo "ssh_reachability=reachable"
            echo "ssh_host_key_trust=live_scan_unpinned"
          } > "$RUNNER_TEMP/vps-audit.txt"

      - name: Run remote read-only audit
        id: remote_audit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o "IdentityFile=$VPS_SSH_KEY_PATH" \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$VPS_KNOWN_HOSTS_PATH" \
            "$VPS_HOST" \
            "bash -s --" \
            < scripts/vps/audit-remote-deployment.sh \
            | tee -a "$RUNNER_TEMP/vps-audit.txt"

      - name: Summarize audit
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### VPS deployment worker audit"
            echo
            echo '```text'
            if [[ -f "$RUNNER_TEMP/vps-audit.txt" ]]; then
              cat "$RUNNER_TEMP/vps-audit.txt"
            else
              echo "Remote audit did not run. Inspect the SSH preparation step."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
